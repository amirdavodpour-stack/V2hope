name: hope_mobile
description: HOPE — a premium, secure marketplace for work.
publish_to: 'none'
version: 4.0.20+19

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  file_picker: ^8.1.4
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/hope_marketplace_hero.png
    - assets/branding/
