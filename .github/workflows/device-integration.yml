name: Device Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['integration_test/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device_certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resource capacity guard
        run: bash tools/ci-resource-guard.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Provision Android CI toolchain
        run: bash tools/ci-android-toolchain.sh
      - name: Android build preflight
        run: bash tools/android-build-preflight.sh
      - name: Flutter dependencies
        run: flutter pub get
      - name: Verify pubspec lock freshness
        run: bash tools/verify-pubspec-lock-fresh.sh
      - name: Run device integration tests
        id: emulator_test
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: CI_DEVICE_INTEGRATION=true flutter test --no-pub integration_test
        env:
          API_BASE_URL_STAGING: https://staging.api.hope.app
      - name: Runtime gate - device certification
        if: ${{ always() }}
        env:
          GATE_RESULT: ${{ steps.emulator_test.outcome == 'success' && 'pass' || 'fail' }}
        run: node tools/write-evidence.mjs --gate device_certification --result "$GATE_RESULT"
        working-directory: backend
