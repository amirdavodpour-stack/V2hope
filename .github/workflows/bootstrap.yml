name: HOPE-V7 Bootstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap and Verify HOPE-V7
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "Repository root:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 3 -type f \
            -not -path './.git/*' \
            -print | sort | head -500

      - name: Extract HOPE-V7 source archive
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *.zip)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name '*.zip' \
              -not -path '*/.git/*' \
              -print | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No HOPE-V7 ZIP archive was found."
            exit 1
          fi

          echo "Source archive:"
          echo "$ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/hope-v7-source"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting archive..."

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Archive extracted to:"
          echo "$EXTRACT_DIR"

          echo
          echo "Extracted top-level contents:"
          find "$EXTRACT_DIR" -maxdepth 3 -type f -print | sort | head -500

          echo "HOPE_ARCHIVE_ROOT=$EXTRACT_DIR" >> "$GITHUB_ENV"

      - name: Detect HOPE-V7 project root
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$HOPE_ARCHIVE_ROOT"

          ROOT=""

          echo "Searching for HOPE-V7 project root..."

          while IFS= read -r candidate; do

            if [ -f "$candidate/pubspec.yaml" ] \
              && [ -d "$candidate/lib" ] \
              && [ -d "$candidate/backend" ]; then

              ROOT="$candidate"
              break

            fi

          done < <(
            find "$SEARCH_ROOT" \
              -type f \
              -name 'pubspec.yaml' \
              -not -path '*/.git/*' \
              -print |
            while IFS= read -r file; do
              dirname "$file"
            done
          )

          if [ -z "$ROOT" ]; then
            echo "ERROR: HOPE-V7 project root could not be detected."

            echo
            echo "Candidate pubspec.yaml files:"
            find "$SEARCH_ROOT" \
              -type f \
              -name 'pubspec.yaml' \
              -print || true

            echo
            echo "Archive contents:"
            find "$SEARCH_ROOT" \
              -maxdepth 5 \
              -type f \
              -print | sort | head -1000

            exit 1
          fi

          echo "HOPE-V7 project root:"
          echo "$ROOT"

          echo "HOPE_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          echo "Verifying HOPE-V7 structure..."

          test -f "pubspec.yaml"
          test -d "lib"
          test -d "backend"
          test -f "backend/package.json"
          test -f "lib/features/jobs/jobs_page.dart"

          echo
          echo "Required structure:"
          echo "PASS: pubspec.yaml"
          echo "PASS: lib/"
          echo "PASS: backend/"
          echo "PASS: backend/package.json"
          echo "PASS: lib/features/jobs/jobs_page.dart"

      - name: Verify backend configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          if [ -f "backend/src/config.js" ]; then
            echo "PASS: backend/src/config.js"
          else
            echo "WARNING: backend/src/config.js not found."
            echo "Listing backend/src:"
            find backend/src -maxdepth 2 -type f -print | sort || true
          fi

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT/backend"

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found."
            echo "Running npm ci..."
            npm ci
          else
            echo "package-lock.json not found."
            echo "Running npm install..."
            npm install
          fi

      - name: Repair bootstrap verifier
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOPE_PROJECT_ROOT/.github/bootstrap"

          cd "$HOPE_PROJECT_ROOT"

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            '' \
            'ROOT="$(git rev-parse --show-toplevel 2>/dev/null || true)"' \
            '' \
            'if [ -n "$ROOT" ]; then' \
            '  cd "$ROOT"' \
            'fi' \
            '' \
            'test -f "pubspec.yaml"' \
            'test -d "lib"' \
            'test -d "backend"' \
            'test -f "backend/package.json"' \
            'test -f "lib/features/jobs/jobs_page.dart"' \
            '' \
            'echo "HOPE-V7 bootstrap verification passed."' \
            > .github/bootstrap/verify-hope-v7.sh

          chmod +x .github/bootstrap/verify-hope-v7.sh

          bash -n .github/bootstrap/verify-hope-v7.sh

          test -x .github/bootstrap/verify-hope-v7.sh

          echo "Bootstrap verifier created successfully."

      - name: Run bootstrap verifier
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          bash .github/bootstrap/verify-hope-v7.sh

      - name: Verify Node 24
        shell: bash
        run: |
          set -euo pipefail

          NODE_VERSION="$(node --version)"
          NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"

          echo "Node version: $NODE_VERSION"

          if [ "$NODE_MAJOR" -lt 24 ]; then
            echo "ERROR: Node 24+ is required."
            exit 1
          fi

          echo "PASS: Node 24"

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT/backend"

          npm test

      - name: Run backend syntax checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          test -d "backend/src"

          echo "Checking backend JavaScript syntax..."

          find backend/src \
            -type f \
            -name '*.js' \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            node --check "$file"
          done

          echo "PASS: backend syntax"

      - name: Run npm audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT/backend"

          npm audit --audit-level=high

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          echo
          echo "========================================"
          echo "HOPE-V7 BOOTSTRAP FINAL VERIFICATION"
          echo "========================================"

          echo
          echo "Project root:"
          pwd

          echo
          echo "Node:"
          node --version

          echo
          echo "Required files:"

          test -f "pubspec.yaml"
          echo "PASS: pubspec.yaml"

          test -d "lib"
          echo "PASS: lib/"

          test -d "backend"
          echo "PASS: backend/"

          test -f "backend/package.json"
          echo "PASS: backend/package.json"

          test -f "lib/features/jobs/jobs_page.dart"
          echo "PASS: lib/features/jobs/jobs_page.dart"

          echo
          echo "========================================"
          echo "HOPE-V7 BOOTSTRAP COMPLETE"
          echo "========================================"
