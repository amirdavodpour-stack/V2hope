name: HOPE-V8 Bootstrap

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - ".github/workflows/bootstrap.yml"
      - ".github/workflows/*.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: hope-v8-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-verify:
    name: Bootstrap and Verify HOPE-V8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac465f34f1872e81e9c9c0c9e1b4a3f5f7a0

      - name: Discover and safely extract project archive
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          archives=( *.zip )

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No ZIP archive found."
            echo "Bootstrap can only import a project from a ZIP archive."
            exit 1
          fi

          archive=""
          for candidate in "${archives[@]}"; do
            case "$candidate" in
              *HOPE*|*hope*|*.zip)
                archive="$candidate"
                break
                ;;
            esac
          done

          if [ -z "$archive" ]; then
            echo "Unable to determine project archive."
            exit 1
          fi

          echo "Using archive: $archive"

          rm -rf bootstrap-extracted
          mkdir -p bootstrap-extracted

          unzip -q "$archive" -d bootstrap-extracted

          mapfile -t roots < <(
            find bootstrap-extracted -type f -name pubspec.yaml -print |
            while read -r pubspec; do
              root="$(dirname "$pubspec")"

              if [ -f "$root/backend/package.json" ] &&
                 [ -d "$root/lib" ] &&
                 [ -d "$root/backend/src" ]; then
                printf '%s\n' "$root"
              fi
            done
          )

          if [ "${#roots[@]}" -ne 1 ]; then
            echo "Expected exactly one valid HOPE-V8 project root."
            echo "Found ${#roots[@]} valid roots:"
            printf '  %s\n' "${roots[@]:-<none>}"
            exit 1
          fi

          PROJECT_ROOT="${roots[0]}"

          if [ ! -f "$PROJECT_ROOT/pubspec.yaml" ]; then
            echo "Missing pubspec.yaml."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/backend/package.json" ]; then
            echo "Missing backend/package.json."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/lib" ]; then
            echo "Missing lib directory."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/backend/src" ]; then
            echo "Missing backend/src directory."
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify canonical workflow set
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          required_workflows=(
            ".github/workflows/bootstrap.yml"
            ".github/workflows/main.yml"
            ".github/workflows/device-integration.yml"
            ".github/workflows/staging-certification.yml"
            ".github/workflows/production-release.yml"
            ".github/workflows/final-build-bootstrap.yml"
          )

          for workflow in "${required_workflows[@]}"; do
            if [ ! -f "$workflow" ]; then
              echo "Missing required workflow: $workflow"
              exit 1
            fi
          done

          echo "All canonical workflows are present in the imported project."

      - name: Verify production workflow secret contract
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          production_workflow=".github/workflows/production-release.yml"

          required_secrets=(
            "DATABASE_URL_PRODUCTION"
            "S3_BUCKET_PRODUCTION"
            "S3_REGION_PRODUCTION"
            "PUBLIC_BASE_URL"
            "ACCESS_TOKEN_SECRET_PRODUCTION"
            "REFRESH_TOKEN_SECRET_PRODUCTION"
            "METRICS_TOKEN_PRODUCTION"
            "PAYMENT_WEBHOOK_SECRET_PRODUCTION"
            "PAYMENT_PROVIDER_TOKEN_PRODUCTION"
            "PAYMENT_PROVIDER_CREATE_URL_PRODUCTION"
            "PAYMENT_PROVIDER_RELEASE_URL_PRODUCTION"
            "PAYMENT_PROVIDER_REFUND_URL_PRODUCTION"
            "ALLOWED_CORS_ORIGINS_PRODUCTION"
            "RESET_TOKEN_DELIVERY_URL_PRODUCTION"
            "RESET_TOKEN_DELIVERY_SECRET_PRODUCTION"
            "ANDROID_RELEASE_KEYSTORE_B64"
            "ANDROID_RELEASE_KEYSTORE_PASSWORD"
            "ANDROID_RELEASE_KEY_ALIAS"
            "ANDROID_RELEASE_KEY_PASSWORD"
          )

          for secret_name in "${required_secrets[@]}"; do
            if ! grep -q "$secret_name" "$production_workflow"; then
              echo "Production workflow does not reference required secret: $secret_name"
              exit 1
            fi
          done

          echo "Production secret contract OK."

      - name: Verify bootstrap does not call staging certification dynamically
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if grep -Eq '^[[:space:]]*uses:[[:space:]]*\./\.github/workflows/staging-certification\.yml' \
            .github/workflows/bootstrap.yml; then
            echo "ERROR: bootstrap.yml must not call staging-certification.yml."
            echo "Bootstrap runs before imported workflow files can become part of GitHub's workflow graph."
            exit 1
          fi

          echo "Bootstrap workflow graph is self-contained."

      - name: Install Node.js 24
        uses: actions/setup-node@1e60f620b9541dca8c6b7b9b6f4c7a0b5c2c4a7d
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "${{ env.PROJECT_ROOT }}/backend/package-lock.json"

      - name: Install Java 17
        uses: actions/setup-java@19c68a4c6f6f5f5f7f5a0f9c8b7d6e5f4a3b2c1d
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@fd8f0f8b9f6c2e3d4a5b6c7d8e9f0a1b2c3d4e5f
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Validate imported repository structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f pubspec.yaml
          test -f pubspec.lock
          test -f backend/package.json
          test -f backend/package-lock.json
          test -d backend/src
          test -d backend/tests
          test -d lib
          test -d android
          test -d tools

          echo "Repository structure OK."

      - name: Validate workflow references and security contracts
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ ! -f tools/check-workflows.py ]; then
            echo "Missing tools/check-workflows.py"
            exit 1
          fi

          python3 tools/check-workflows.py

      - name: Verify executable permissions
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          failures=0

          while IFS= read -r -d '' script; do
            if [ ! -x "$script" ]; then
              echo "Missing executable bit: $script"
              failures=1
            fi
          done < <(find . -type f -name "*.sh" -print0)

          if [ -f android/gradlew ] && [ ! -x android/gradlew ]; then
            echo "Missing executable bit: android/gradlew"
            failures=1
          fi

          if [ "$failures" -ne 0 ]; then
            echo
            echo "Executable permission contract failed."
            echo "Repackage the project with POSIX executable bits preserved."
            exit 1
          fi

          echo "Executable permissions OK."

      - name: Install backend dependencies
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Backend core syntax check
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Backend persistence boundary
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        shell: bash
        run: |
          set -euo pipefail

          npm run test:contract -- \
            tests/persistence-boundary.test.mjs

      - name: Backend fast and architecture gates
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        shell: bash
        run: |
          set -euo pipefail

          npm run test:fast
          npm run test:architecture-layers

      - name: Backend production contract
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        shell: bash
        run: |
          set -euo pipefail

          npm run test:production-env
          npm run test:release-evidence
          npm run check:toolchain-contract

      - name: Flutter lock freshness
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get --enforce-lockfile

          git diff --exit-code -- pubspec.lock

      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze

      - name: Flutter full test suite
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          flutter test

      - name: Final bootstrap verification
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "PASS: validated project and canonical CI/CD imported safely."
          echo "PASS: bootstrap does not dynamically invoke reusable workflows."
          echo "PASS: workflow references and executable permissions validated."
          echo "PASS: backend syntax, persistence, architecture, and production contracts validated."
          echo "PASS: Flutter lock, analyze, and full test suite validated."
          echo
          echo "IMPORTANT:"
          echo "The final production build must be launched by"
          echo ".github/workflows/final-build-bootstrap.yml"
          echo "after these workflows are committed to the repository:"
          echo "  - staging-certification.yml"
          echo "  - production-release.yml"
          echo "  - final-build-bootstrap.yml"

      - name: Upload bootstrap verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-v8-bootstrap-report
          path: |
            ${{ env.PROJECT_ROOT }}/test-results/**
          if-no-files-found: ignore
          retention-days: 14
