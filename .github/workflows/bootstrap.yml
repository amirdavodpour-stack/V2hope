name: HOPE-V7 Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify session archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="HOPE-V7-4.0.20-SESSION-20260913T141130Z-final.zip"

          echo "========================================"
          echo "HOPE-V7 SESSION ARCHIVE CHECK"
          echo "========================================"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Session archive not found:"
            echo "$ARCHIVE"
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE"

          echo ""
          echo "Archive size:"
          stat -c '%s bytes' "$ARCHIVE"

          echo ""
          echo "Archive SHA-256:"
          sha256sum "$ARCHIVE"

          echo ""
          echo "Checking required files inside archive..."

          REQUIRED_FILES=(
            "pubspec.yaml"
            "lib/features/jobs/jobs_page.dart"
            "backend/package.json"
            "backend/src/config.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if ! unzip -Z1 "$ARCHIVE" | grep -Fxq "$FILE"; then
              echo ""
              echo "ERROR: Required file is missing from archive:"
              echo "$FILE"
              echo ""
              echo "Relevant archive entries:"
              unzip -Z1 "$ARCHIVE" \
                | grep -E '(^|/)(pubspec.yaml|package.json|jobs_page.dart|config.js)$' \
                || true
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "Archive contains the complete HOPE-V7 project."

      - name: Extract session archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/hope
          mkdir -p /tmp/hope

          unzip -q -o \
            "HOPE-V7-4.0.20-SESSION-20260913T141130Z-final.zip" \
            -d /tmp/hope

          echo "Archive extracted."

      - name: Locate complete project root
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "LOCATING HOPE-V7 PROJECT ROOT"
          echo "========================================"

          ROOT=""

          while IFS= read -r PUBSPEC; do
            CANDIDATE="$(dirname "$PUBSPEC")"

            if [ -f "$CANDIDATE/pubspec.yaml" ] &&
               [ -d "$CANDIDATE/lib" ] &&
               [ -d "$CANDIDATE/backend" ] &&
               [ -f "$CANDIDATE/backend/package.json" ] &&
               [ -f "$CANDIDATE/lib/features/jobs/jobs_page.dart" ] &&
               [ -f "$CANDIDATE/backend/src/config.js" ]; then

              ROOT="$CANDIDATE"
              break
            fi
          done < <(find /tmp/hope -type f -name "pubspec.yaml" -print | sort)

          if [ -z "$ROOT" ]; then
            echo ""
            echo "ERROR: Complete HOPE-V7 project root could not be located."
            echo ""
            echo "Extracted project markers:"
            find /tmp/hope -type f \
              \( \
                -name "pubspec.yaml" \
                -o -name "package.json" \
                -o -name "jobs_page.dart" \
                -o -name "config.js" \
              \) \
              -print \
              | sort

            echo ""
            echo "Top-level extracted structure:"
            find /tmp/hope -maxdepth 3 -type d \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          echo "Complete project root:"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Validate complete project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PROJECT STRUCTURE VALIDATION"
          echo "========================================"

          REQUIRED_PATHS=(
            "pubspec.yaml"
            "lib"
            "lib/features/jobs/jobs_page.dart"
            "backend"
            "backend/package.json"
            "backend/src"
            "backend/src/config.js"
          )

          for PATH_TO_CHECK in "${REQUIRED_PATHS[@]}"; do
            if [ ! -e "$PROJECT_ROOT/$PATH_TO_CHECK" ]; then
              echo "ERROR: Missing:"
              echo "$PROJECT_ROOT/$PATH_TO_CHECK"
              exit 1
            fi

            echo "OK: $PATH_TO_CHECK"
          done

          echo ""
          echo "Project structure validation PASSED."

      - name: Copy complete project to repository
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COPYING COMPLETE HOPE-V7 PROJECT"
          echo "========================================"

          rsync -a \
            "$PROJECT_ROOT/" \
            "./" \
            --exclude ".git/" \
            --exclude ".github/workflows/bootstrap.yml"

          echo ""
          echo "Project copied."

      - name: Verify repository contents
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "POST-COPY VERIFICATION"
          echo "========================================"

          REQUIRED_FILES=(
            "pubspec.yaml"
            "lib/features/jobs/jobs_page.dart"
            "backend/package.json"
            "backend/src/config.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required repository file missing:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "Repository contains the complete HOPE-V7 project."

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BACKEND DEPENDENCY INSTALLATION"
          echo "========================================"

          cd backend

          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Validate Node scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "NODE SYNTAX VALIDATION"
          echo "========================================"

          if [ -f "backend/src/config.js" ]; then
            node --check "backend/src/config.js"
          fi

          if [ -f "backend/src/repository.js" ]; then
            node --check "backend/src/repository.js"
          fi

          if [ -f "tools/staging-operational-gate.mjs" ]; then
            node --check "tools/staging-operational-gate.mjs"
          fi

          echo ""
          echo "Node syntax validation PASSED."

      - name: Run root project checks
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ROOT PROJECT CHECKS"
          echo "========================================"

          if [ -f package.json ]; then
            npm run bootstrap --if-present
            npm run setup --if-present
            npm run verify --if-present
            npm test --if-present
          else
            echo "No root package.json found."
            echo "Skipping root Node checks."
          fi

      - name: Run backend checks
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BACKEND CHECKS"
          echo "========================================"

          cd backend

          npm run bootstrap --if-present
          npm run setup --if-present
          npm run verify --if-present
          npm test --if-present

      - name: Check repository state
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "REPOSITORY STATE"
          echo "========================================"

          git status --short

          echo ""
          git diff --stat

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMMITTING HOPE-V7"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit \
              -m "chore: bootstrap complete HOPE-V7 project from session archive"

            git push origin HEAD:main
          fi

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL HOPE-V7 VERIFICATION"
          echo "========================================"

          test -f pubspec.yaml
          test -d lib
          test -f lib/features/jobs/jobs_page.dart
          test -d backend
          test -f backend/package.json
          test -f backend/src/config.js

          echo ""
          echo "========================================"
          echo "HOPE-V7 BOOTSTRAP: PASS"
          echo "========================================"
          echo ""
          echo "Complete project root detected."
          echo "Flutter project files verified."
          echo "Backend files verified."
          echo "Node files verified."
          echo "Repository state verified."
          echo ""
          echo "STATUS: PASS"
