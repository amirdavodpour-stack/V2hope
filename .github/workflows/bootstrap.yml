name: HOPE-V7 Bootstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap and Verify HOPE-V7
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          while IFS= read -r candidate; do
            if [ -f "$candidate/pubspec.yaml" ] \
              && [ -d "$candidate/lib" ] \
              && [ -d "$candidate/backend" ] \
              && [ -d "$candidate/src" ] 2>/dev/null; then
              ROOT="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -print | while read -r file; do
                dirname "$file"
              done
          )

          if [ -z "$ROOT" ]; then
            if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ] \
              && [ -d "$GITHUB_WORKSPACE/lib" ] \
              && [ -d "$GITHUB_WORKSPACE/backend" ]; then
              ROOT="$GITHUB_WORKSPACE"
            else
              echo "ERROR: HOPE-V7 project root could not be detected."
              exit 1
            fi
          fi

          echo "Project root: $ROOT"
          echo "HOPE_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          test -f "pubspec.yaml"
          test -d "lib"
          test -d "backend"
          test -f "backend/package.json"
          test -f "lib/features/jobs/jobs_page.dart"

          echo "Project structure verified."

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT/backend"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Repair bootstrap verifier
        shell: bash
        run: |
          mkdir -p "$HOPE_PROJECT_ROOT/.github/bootstrap"

          cd "$HOPE_PROJECT_ROOT"

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            '' \
            'ROOT="$(git rev-parse --show-toplevel)"' \
            'cd "$ROOT"' \
            '' \
            'test -f "pubspec.yaml"' \
            'test -d "lib"' \
            'test -f "lib/features/jobs/jobs_page.dart"' \
            'test -f "backend/package.json"' \
            'test -f "backend/src/config.js"' \
            '' \
            'echo "HOPE-V7 bootstrap verification passed."' \
            > .github/bootstrap/verify-hope-v7.sh

          chmod +x .github/bootstrap/verify-hope-v7.sh

          bash -n .github/bootstrap/verify-hope-v7.sh

          test -x .github/bootstrap/verify-hope-v7.sh

          echo "Bootstrap verifier repaired successfully."

      - name: Run bootstrap verifier
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          bash .github/bootstrap/verify-hope-v7.sh

      - name: Verify Node version
        shell: bash
        run: |
          set -euo pipefail

          node --version

          NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"

          if [ "$NODE_MAJOR" -lt 24 ]; then
            echo "ERROR: Node 24+ is required."
            exit 1
          fi

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT/backend"

          npm test

      - name: Run syntax checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT"

          find backend/src \
            -type f \
            -name '*.js' \
            -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Run npm audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOPE_PROJECT_ROOT/backend"

          npm audit --audit-level=high

      - name: Bootstrap summary
        shell: bash
        run: |
          echo "========================================"
          echo "HOPE-V7 BOOTSTRAP COMPLETE"
          echo "========================================"
          echo "Project root: $HOPE_PROJECT_ROOT"
          echo "Node: $(node --version)"
          echo "Bootstrap verifier: PASS"
          echo "========================================"
