name: HOPE ZIP Release/Staging Bootstrap v3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Import the final ZIP and run staging or release"
        required: true
        type: choice
        options:
          - staging
          - release
        default: staging
      confirm:
        description: "Type release only when mode=release"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      ZIP_FILE: HOPE-V8-RELEASE-STAGING-FINAL.zip
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Require workflow-capable repository token
        shell: bash
        env:
          REPO_WORKFLOW_TOKEN: ${{ secrets.REPO_WORKFLOW_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$REPO_WORKFLOW_TOKEN" || {
            echo "ERROR: repository secret REPO_WORKFLOW_TOKEN is required." >&2
            echo "It must be a token authorized to push repository workflow files." >&2
            exit 1
          }

      - name: Import final HOPE project and preserve active bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE was not found at repository root." >&2
            exit 1
          }

          test -f .github/workflows/bootstrap.yml || {
            echo "ERROR: active .github/workflows/bootstrap.yml is missing before import." >&2
            exit 1
          }

          BOOTSTRAP_BACKUP="$RUNNER_TEMP/bootstrap.yml"
          cp .github/workflows/bootstrap.yml "$BOOTSTRAP_BACKUP"

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          unzip -q "$ZIP_FILE" -d "$TMP"

          # Accept either a repository-root ZIP or a single top-level wrapper.
          if [ ! -f "$TMP/pubspec.yaml" ]; then
            roots=()
            while IFS= read -r -d '' d; do
              roots+=("$d")
            done < <(find "$TMP" -mindepth 1 -maxdepth 1 -type d -print0)

            if [ "${#roots[@]}" -eq 1 ] && [ -f "${roots[0]}/pubspec.yaml" ]; then
              TMP="${roots[0]}"
            else
              echo "ERROR: final ZIP does not resolve to a Flutter project root containing pubspec.yaml." >&2
              exit 1
            fi
          fi

          test -f "$TMP/pubspec.yaml"
          test -d "$TMP/.github/workflows"

          # Import all project files, including final workflows, except the
          # active bootstrap.yml. IMPORTANT: do not copy the workflows directory
          # as a whole, because that would overwrite the excluded bootstrap.
          while IFS= read -r -d '' item; do
            rel="${item#"$TMP"/}"

            case "$rel" in
              .git|.git/*)
                continue
                ;;
              .github/workflows|.github/workflows/)
                continue
                ;;
              .github/workflows/bootstrap.yml)
                continue
                ;;
            esac

            target="./$rel"
            rm -rf -- "$target"
            mkdir -p "$(dirname "$target")"
            cp -a "$item" "$target"
          done < <(find "$TMP" -mindepth 1 -print0)

          # Never allow the ZIP to replace the active bootstrap.
          cp "$BOOTSTRAP_BACKUP" .github/workflows/bootstrap.yml

          # Remove any malformed nested workflow tree from a previous import.
          rm -rf .github/workflows/.github

          chmod +x android/gradlew
          find tools -type f -name '*.sh' -exec chmod +x {} +

          echo "Final project imported."
          echo "Active bootstrap preserved."
          git status --short

      - name: Validate final project and workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f pubspec.yaml
          test -f android/gradlew
          test -x android/gradlew

          python3 tools/check-workflows.py

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          root = Path(".github/workflows")
          required = {
              "bootstrap.yml",
              "staging-certification.yml",
              "production-release.yml",
          }

          files = sorted(root.glob("*.yml")) + sorted(root.glob("*.yaml"))
          names = {p.name for p in files}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(
                  "Missing required active workflows: " + ", ".join(missing)
              )

          nested = list(root.glob("**/.github/workflows/*"))
          if nested:
              raise SystemExit(
                  "Malformed nested workflow tree detected: "
                  + ", ".join(str(p) for p in nested)
              )

          for path in files:
              with path.open(encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"YAML OK: {path}")

          print("ACTIVE_WORKFLOW_VALIDATION_PASS")
          PY

      - name: Verify active bootstrap is unchanged
        shell: bash
        run: |
          set -Eeuo pipefail

          cmp -s "$RUNNER_TEMP/bootstrap.yml" .github/workflows/bootstrap.yml || {
            echo "ERROR: active bootstrap differs from its pre-import byte-for-byte backup." >&2
            exit 1
          }

          if git diff --quiet -- .github/workflows/bootstrap.yml; then
            echo "BOOTSTRAP_PRESERVED_PASS"
          else
            echo "ERROR: active .github/workflows/bootstrap.yml changed." >&2
            exit 1
          fi

      - name: Commit final project
        shell: bash
        env:
          REPO_WORKFLOW_TOKEN: ${{ secrets.REPO_WORKFLOW_TOKEN }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes needed."
            echo "IMPORT_COMMIT_SKIPPED_PASS"
          else
            git commit -m "Import final HOPE release staging project"
            git remote set-url origin "https://x-access-token:${REPO_WORKFLOW_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "IMPORT_PUSH_PASS"
          fi

      - name: Verify pushed revision
        shell: bash
        env:
          REPO_WORKFLOW_TOKEN: ${{ secrets.REPO_WORKFLOW_TOKEN }}
        run: |
          set -Eeuo pipefail

          git fetch origin "${GITHUB_REF_NAME}"
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse "origin/${GITHUB_REF_NAME}")"

          test "$LOCAL" = "$REMOTE" || {
            echo "ERROR: pushed revision does not match local revision." >&2
            echo "local=$LOCAL" >&2
            echo "remote=$REMOTE" >&2
            exit 1
          }

          echo "PUSHED_REVISION_PASS=$REMOTE"

      - name: Dispatch staging certification
        if: ${{ env.MODE == 'staging' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_WORKFLOW_TOKEN }}
        run: |
          set -Eeuo pipefail

          gh workflow run staging-certification.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_REF_NAME}"

          echo "STAGING_DISPATCHED_PASS"

      - name: Dispatch full production release
        if: ${{ env.MODE == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_WORKFLOW_TOKEN }}
        run: |
          set -Eeuo pipefail

          test "$CONFIRM" = "release" || {
            echo "ERROR: mode=release requires confirm=release." >&2
            exit 1
          }

          gh workflow run production-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_REF_NAME}" \
            -f confirm=release

          echo "RELEASE_DISPATCHED_PASS"
