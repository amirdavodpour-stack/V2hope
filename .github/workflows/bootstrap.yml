name: HOPE ZIP Release/Staging Bootstrap v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Import the final ZIP and run staging or release"
        required: true
        type: choice
        options:
          - staging
          - release
        default: staging
      confirm:
        description: "Type release only when mode=release"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      ZIP_FILE: HOPE-V8-RELEASE-STAGING-FINAL.zip
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Import final HOPE project without replacing bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE was not found at repository root." >&2
            exit 1
          }

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          unzip -q "$ZIP_FILE" -d "$TMP"

          test -f "$TMP/pubspec.yaml" || {
            echo "ERROR: final ZIP does not contain pubspec.yaml." >&2
            exit 1
          }
          test -d "$TMP/.github/workflows" || {
            echo "ERROR: final ZIP does not contain .github/workflows." >&2
            exit 1
          }

          # Import everything except .git and .github/workflows.
          # The currently installed bootstrap.yml and existing workflow files
          # are intentionally preserved. This avoids requiring the GITHUB_TOKEN
          # to create/update workflow files.
          while IFS= read -r -d '' item; do
            rel="${item#"$TMP"/}"
            case "$rel" in
              .github/workflows|.github/workflows/*)
                continue
                ;;
            esac

            target="./$rel"
            rm -rf -- "$target"
            mkdir -p "$(dirname "$target")"
            cp -a "$item" "$target"
          done < <(find "$TMP" -mindepth 1 -maxdepth 1 -print0)

          # Import the final workflow set only as audit artifacts outside
          # .github/workflows. They are NOT activated by this run.
          rm -rf .ci-final-workflows
          mkdir -p .ci-final-workflows
          cp -a "$TMP/.github/workflows/." .ci-final-workflows/

          # Required executable permissions.
          chmod +x android/gradlew
          find tools -type f -name '*.sh' -exec chmod +x {} +

          echo "Final project imported."
          echo "Existing .github/workflows files preserved."
          git status --short

      - name: Validate imported project
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f pubspec.yaml
          test -f android/gradlew
          test -x android/gradlew

          python3 tools/check-workflows.py

      - name: Validate final workflow payload separately
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          root = Path(".ci-final-workflows")
          required = {
              "bootstrap.yml",
              "staging-certification.yml",
              "production-release.yml",
          }

          names = {p.name for p in root.glob("*.yml")} | {p.name for p in root.glob("*.yaml")}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing final workflow files: {', '.join(missing)}")

          for path in sorted(root.iterdir()):
              if path.suffix not in {".yml", ".yaml"}:
                  continue
              with path.open(encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"YAML OK: {path}")

          print("Final workflow payload is syntactically valid.")
          PY

      - name: Commit imported project
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes needed."
          else
            git commit -m "Import final HOPE release staging project"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check bootstrap workflow remained untouched
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff HEAD^ HEAD -- .github/workflows/bootstrap.yml || true

          # The import step deliberately never writes this file.
          # If it changed for another reason, fail rather than silently
          # replacing the active bootstrap workflow.
          if git diff --quiet HEAD^ HEAD -- .github/workflows/bootstrap.yml; then
            echo "BOOTSTRAP_PRESERVED_PASS"
          else
            echo "ERROR: active .github/workflows/bootstrap.yml changed." >&2
            exit 1
          fi

      - name: Dispatch staging certification
        if: ${{ env.MODE == 'staging' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          gh workflow run staging-certification.yml \
            --ref "${GITHUB_REF_NAME}"

          echo "STAGING_DISPATCHED_PASS"

      - name: Dispatch full production release
        if: ${{ env.MODE == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          test "$CONFIRM" = "release" || {
            echo "ERROR: mode=release requires confirm=release." >&2
            exit 1
          }

          gh workflow run production-release.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f confirm=release

          echo "RELEASE_DISPATCHED_PASS"
