name: HOPE ZIP Release/Staging Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Extract the final HOPE ZIP, commit it, then run staging or full release"
        required: true
        type: choice
        options:
          - staging
          - release
        default: staging
      confirm:
        description: "Type release only when mode=release"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: hope-zip-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      ZIP_FILE: HOPE-V8-RELEASE-STAGING-FINAL.zip
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Import final HOPE project from ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE was not found at repository root." >&2
            exit 1
          }

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          unzip -q "$ZIP_FILE" -d "$TMP"

          test -f "$TMP/.github/workflows/staging-certification.yml" || {
            echo "ERROR: final ZIP does not contain staging-certification.yml." >&2
            exit 1
          }
          test -f "$TMP/.github/workflows/production-release.yml" || {
            echo "ERROR: final ZIP does not contain production-release.yml." >&2
            exit 1
          }
          test -f "$TMP/pubspec.yaml" || {
            echo "ERROR: final ZIP does not contain pubspec.yaml." >&2
            exit 1
          }

          # Replace repository contents with the final project while keeping
          # the uploaded ZIP available for audit/recovery.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name "$ZIP_FILE" \
            -exec rm -rf -- {} +

          cp -a "$TMP/." .

          # Preserve the executable permissions required by the Android/CI toolchain.
          chmod +x android/gradlew
          find tools -type f -name '*.sh' -exec chmod +x {} +

          echo "Imported final project:"
          git status --short

      - name: Validate imported workflows before commit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/check-workflows.py

      - name: Commit imported final project
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes were needed."
          else
            git commit -m "Bootstrap final HOPE release/staging project"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch staging certification
        if: ${{ env.MODE == 'staging' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run staging-certification.yml \
            --ref "${GITHUB_REF_NAME}"

          echo "STAGING workflow dispatched on ${GITHUB_REF_NAME}."
          echo "The staging workflow is now running from the imported final project."

      - name: Dispatch full production release
        if: ${{ env.MODE == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          test "$CONFIRM" = "release" || {
            echo "ERROR: mode=release requires confirm=release." >&2
            exit 1
          }

          gh workflow run production-release.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f confirm=release

          echo "PRODUCTION release workflow dispatched on ${GITHUB_REF_NAME}."
          echo "Production release will run its staging certification gate first."
