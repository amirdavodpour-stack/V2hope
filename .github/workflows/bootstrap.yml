name: HOPE-V8 Bootstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Run bootstrap verification"
        required: false
        default: "verify"
        type: string

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.47.2"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_PLATFORM: "android-36"
  ANDROID_NDK_VERSION: "28.2.13676358"
  GRADLE_VERSION: "8.14.3"

jobs:
  bootstrap:
    name: Bootstrap and Verify HOPE-V8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Locate source archive
        id: source_archive
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t archives < <(
            find . -maxdepth 3 -type f \
              \( -name '*.zip' -o -name '*.ZIP' \) \
              -not -path './.git/*' \
              -print
          )

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one source ZIP archive; found ${#archives[@]}." >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

          ARCHIVE="${archives[0]}"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "SOURCE_ARCHIVE=$ARCHIVE"

      - name: Extract source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf .bootstrap-source
          mkdir -p .bootstrap-source

          unzip -q "${{ steps.source_archive.outputs.archive }}" -d .bootstrap-source

          test -f .bootstrap-source/pubspec.yaml || {
            echo "Source archive does not contain pubspec.yaml at expected root." >&2
            find .bootstrap-source -maxdepth 3 -type f | sort | head -200 >&2
            exit 1
          }

      - name: Import source project
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_ROOT=".bootstrap-source"

          cp -a "$SOURCE_ROOT/." .

          test -f pubspec.yaml
          test -f pubspec.lock
          test -f backend/package.json
          test -f backend/package-lock.json

      - name: Restore executable permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          find tools -type f -name '*.sh' -exec chmod +x {} \; 2>/dev/null || true
          test -x android/gradlew
          chmod +x android/gradlew

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify repository structure
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            pubspec.yaml
            pubspec.lock
            backend/package.json
            backend/package-lock.json
            android/gradlew
            tools/agent-preflight.sh
            tools/runtime-certification-preflight.sh
            tools/android-build-preflight.sh
            tools/ci-android-toolchain.sh
            tools/build_apk_debug.sh
            tools/build_apk_release.sh
            tools/check-workflows.py
            .github/workflows/staging-certification.yml
            .github/workflows/production-release.yml
          )

          for file in "${required_files[@]}"; do
            test -e "$file" || {
              echo "Missing required path: $file" >&2
              exit 1
            }
          done

      - name: Resource guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci-resource-guard.sh

      - name: Agent preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/agent-preflight.sh

      - name: Validate workflow graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/check-workflows.py

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Backend authoritative test suite
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:all

      - name: Backend security audit
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm audit --audit-level=high

      - name: Generate backend SBOM
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run sbom

          test -s artifacts/sbom.json || {
            echo "SBOM was not generated or is empty." >&2
            find artifacts -maxdepth 2 -type f -print >&2 || true
            exit 1
          }

      - name: Flutter dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get --enforce-lockfile

          if [ -x tools/verify-pubspec-lock-fresh.sh ]; then
            bash tools/verify-pubspec-lock-fresh.sh
          fi

      - name: Flutter analyze
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter analyze

      - name: Flutter tests
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter test --no-pub

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/ci-android-toolchain.sh

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          test -d "$SDK_ROOT"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          ANDROID_PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          export PATH="$ANDROID_PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_PATH" >> "$GITHUB_ENV"

          {
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/emulator"
            echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          } >> "$GITHUB_PATH"

          command -v adb
          adb version

          command -v sdkmanager
          sdkmanager --version

      - name: Android build preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/android-build-preflight.sh

      - name: Runtime certification preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          command -v adb
          adb version

          bash tools/runtime-certification-preflight.sh

      - name: Android debug build certification
        timeout-minutes: 30
        shell: bash
        env:
          API_BASE_URL: https://staging.api.hope.app
          BUILD_PROFILE: pilot
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          mkdir -p artifacts

          echo "========================================"
          echo "Android debug build environment"
          echo "========================================"

          java -version
          javac -version
          flutter --version
          adb version

          if command -v aapt2 >/dev/null 2>&1; then
            aapt2 version || true
          fi

          if command -v apksigner >/dev/null 2>&1; then
            apksigner --version || true
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "BUILD_PROFILE=$BUILD_PROFILE"
          echo "API_BASE_URL=$API_BASE_URL"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-}"
          echo "GRADLE_OPTS=${GRADLE_OPTS:-}"

          BUILD_LOG="artifacts/android-debug-build.log"

          set +e
          bash tools/build_apk_debug.sh 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "========================================"
            echo "ANDROID DEBUG BUILD FAILED"
            echo "========================================"

            echo
            echo "--- Gradle / Flutter failure markers ---"

            grep -nE \
              'FAILURE:|What went wrong:|What failed:|Execution failed|Caused by:|error:|ERROR:|BUILD FAILED|Could not|Unable to|Exception' \
              "$BUILD_LOG" | tail -n 300 || true

            echo
            echo "--- Last 500 log lines ---"
            tail -n 500 "$BUILD_LOG"

            echo
            echo "--- Gradle daemon / project diagnostics ---"

            if [ -d android ]; then
              (
                cd android
                ./gradlew --version || true
              )
            fi

            echo
            echo "--- Generated APK directory ---"
            find build/app/outputs/flutter-apk \
              -maxdepth 2 \
              -type f \
              -printf '%p %s bytes\n' 2>/dev/null || true

            exit "$BUILD_STATUS"
          fi

          test -s "$BUILD_LOG"

          echo "ANDROID_DEBUG_BUILD_LOG=$BUILD_LOG"

      - name: Collect bootstrap evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts

          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "ref=${GITHUB_REF}"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "java=$(java -version 2>&1 | head -1 || true)"
            echo "flutter=$(flutter --version 2>/dev/null | head -1 || true)"
            echo "gradle=$(cd android && ./gradlew --version 2>/dev/null | grep '^Gradle ' | head -1 || true)"
          } > artifacts/bootstrap-environment.txt

          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml artifacts/pubspec.yaml
          fi

          if [ -f pubspec.lock ]; then
            cp pubspec.lock artifacts/pubspec.lock
          fi

          if [ -d backend/artifacts ]; then
            cp -a backend/artifacts/. artifacts/ 2>/dev/null || true
          fi

          find artifacts -maxdepth 2 -type f -print | sort

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hope-v8-bootstrap-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
