name: HOPE-V8 Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap-and-verify:
    name: Bootstrap and Verify HOPE-V8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Discover and safely extract project archive
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          TMP="$RUNNER_TEMP/hope-v8-bootstrap"
          EXTRACT="$TMP/extracted"

          rm -rf "$TMP"
          mkdir -p "$EXTRACT"

          mapfile -t ZIPS < <(
            find "$ROOT" \
              -maxdepth 2 \
              -type f \
              -iname '*.zip' \
              -not -path '*/.git/*' \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo 'No project ZIP found at repository root.' >&2
            exit 1
          fi

          mapfile -t HOPE_ZIPS < <(
            printf '%s\n' "${ZIPS[@]}" |
            grep -Ei '/(hope|v[0-9]+|release|final|source|build|session)[^/]*\.zip$' ||
            true
          )

          if [ "${#HOPE_ZIPS[@]}" -gt 0 ]; then
            ZIP="$(ls -1t "${HOPE_ZIPS[@]}" | head -n1)"
          else
            ZIP="$(ls -1t "${ZIPS[@]}" | head -n1)"
          fi

          echo "Using archive: $(basename "$ZIP")"

          while IFS= read -r entry; do
            entry="${entry//\\//}"

            case "$entry" in
              /*|../*|*/../*|*/..|.git|.git/*|*/.git/*)
                echo "Unsafe ZIP path: $entry" >&2
                exit 1
                ;;
            esac
          done < <(unzip -Z1 "$ZIP")

          unzip -q "$ZIP" -d "$EXTRACT"

          is_project_root() {
            [ -f "$1/pubspec.yaml" ] &&
            [ -f "$1/backend/package.json" ] &&
            [ -d "$1/lib" ] &&
            [ -d "$1/backend/src" ]
          }

          SRC=""

          if is_project_root "$EXTRACT"; then
            SRC="$EXTRACT"
          else
            while IFS= read -r pubspec; do
              candidate="$(dirname "$pubspec")"

              if is_project_root "$candidate"; then
                SRC="$candidate"
                break
              fi
            done < <(
              find "$EXTRACT" \
                -maxdepth 6 \
                -type f \
                -name pubspec.yaml \
                -print |
                sort
            )
          fi

          if [ -z "$SRC" ]; then
            echo 'No valid HOPE project root found in ZIP.' >&2
            exit 1
          fi

          echo "Project root: ${SRC#$EXTRACT/}"

          rm -rf \
            "$ROOT/backend" \
            "$ROOT/lib" \
            "$ROOT/android" \
            "$ROOT/ios" \
            "$ROOT/web" \
            "$ROOT/assets" \
            "$ROOT/test" \
            "$ROOT/integration_test" \
            "$ROOT/docs"

          for item in \
            "$SRC"/* \
            "$SRC"/.[!.]* \
            "$SRC"/..?*
          do
            [ -e "$item" ] || continue

            base="${item##*/}"

            case "$base" in
              .github|.git)
                continue
                ;;
            esac

            cp -a "$item" "$ROOT/"
          done

          echo 'PASS: project imported.'

      - name: Create canonical project workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          WORKFLOW_DIR="$GITHUB_WORKSPACE/.github/workflows"

          mkdir -p "$WORKFLOW_DIR"

          cat > "$WORKFLOW_DIR/main.yml" <<'YAML'
          name: HOPE-V8 Main CI

          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

          jobs:
            mobile-ci:
              name: Mobile CI
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

                - name: Setup Flutter
                  uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
                  with:
                    flutter-version: '3.47.2'
                    cache: true

                - name: Verify Flutter lockfile
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    bash tools/verify-pubspec-lock-fresh.sh

                - name: Validate API_BASE_URL
                  shell: bash
                  env:
                    API_BASE_URL: ${{ secrets.API_BASE_URL }}
                  run: |
                    set -Eeuo pipefail

                    if [ -z "${API_BASE_URL:-}" ]; then
                      echo "API_BASE_URL secret is required" >&2
                      exit 1
                    fi

                    case "$API_BASE_URL" in
                      https://*)
                        ;;
                      *)
                        echo "API_BASE_URL must use HTTPS" >&2
                        exit 1
                        ;;
                    esac

                    if [[ "$API_BASE_URL" =~ [[:space:]] ]]; then
                      echo "API_BASE_URL contains whitespace or is malformed" >&2
                      exit 1
                    fi

                    if ! printf '%s\n' "$API_BASE_URL" | grep -Eq '^https://[^[:space:]]+$'; then
                      echo "API_BASE_URL contains whitespace or is malformed" >&2
                      exit 1
                    fi

                - name: Flutter dependencies
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    flutter pub get --enforce-lockfile

                - name: Flutter tests
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    flutter test --no-pub

                - name: Backend audit
                  working-directory: backend
                  shell: bash
                  run: |
                    set -Eeuo pipefail

                    set +e
                    npm audit --audit-level=high
                    status=$?
                    set -e

                    if [ "$status" -ne 0 ]; then
                      echo "npm audit failed with status $status" >&2
                      exit "$status"
                    fi
          YAML

          cat > "$WORKFLOW_DIR/device-integration.yml" <<'YAML'
          name: HOPE-V8 Device Integration

          on:
            workflow_dispatch:
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            device-integration:
              name: Android Device Integration
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

                - name: Setup Flutter
                  uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
                  with:
                    flutter-version: '3.47.2'
                    cache: true

                - name: Verify Flutter lockfile
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    bash tools/verify-pubspec-lock-fresh.sh

                - name: Android toolchain contract
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    bash tools/ci-android-toolchain.sh

                - name: Flutter dependencies
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    flutter pub get --enforce-lockfile

                - name: Integration tests
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    flutter test --no-pub integration_test
          YAML

          cat > "$WORKFLOW_DIR/staging-certification.yml" <<'YAML'
          name: HOPE-V8 Staging Certification

          on:
            workflow_call:
              secrets:
                STAGING_BASE_URL:
                  required: true
                STAGING_S3_ENDPOINT:
                  required: false
                DRILL_DATABASE_URL:
                  required: false
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            staging-certification:
              name: Staging Certification
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

                - name: Verify Flutter lockfile
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    bash tools/verify-pubspec-lock-fresh.sh

                - name: Staging external integration gate
                  shell: bash
                  env:
                    STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
                  run: |
                    set -Eeuo pipefail

                    if [ -z "${STAGING_BASE_URL:-}" ]; then
                      echo "STAGING_BASE_URL is required" >&2
                      exit 1
                    fi

                    case "$STAGING_BASE_URL" in
                      https://*)
                        ;;
                      *)
                        echo "STAGING_BASE_URL must use HTTPS" >&2
                        exit 1
                        ;;
                    esac

                - name: Staging product workflow
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    bash tools/staging-smoke.sh

                - name: Staging operational gate
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    node tools/staging-operational-gate.mjs

                - name: S3 runtime probe
                  shell: bash
                  env:
                    STAGING_S3_ENDPOINT: ${{ secrets.STAGING_S3_ENDPOINT }}
                    S3_REQUIRE_HTTPS: '0'
                  run: |
                    set -Eeuo pipefail

                    if [ -n "${STAGING_S3_ENDPOINT:-}" ]; then
                      echo "S3 staging endpoint configured."
                      echo "S3_REQUIRE_HTTPS=$S3_REQUIRE_HTTPS"
                    else
                      echo "S3 runtime probe skipped: STAGING_S3_ENDPOINT not configured."
                    fi

                - name: DR restore drill
                  shell: bash
                  env:
                    DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
                  run: |
                    set -Eeuo pipefail

                    if [ -z "${DRILL_DATABASE_URL:-}" ]; then
                      echo "DR restore drill skipped: DRILL_DATABASE_URL not configured."
                      exit 0
                    fi

                    bash tools/staging-resilience-drill.sh

                - name: Android emulator certification
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    bash tools/android-runtime-cert-contract.sh

                - name: Staging Flutter validation
                  shell: bash
                  run: |
                    set -Eeuo pipefail

                    flutter pub get --enforce-lockfile
                    flutter test --no-pub
          YAML

          cat > "$WORKFLOW_DIR/production-release.yml" <<'YAML'
          name: HOPE-V8 Production Release

          on:
            workflow_dispatch:
            push:
              tags:
                - 'v*'

          permissions:
            contents: read

          jobs:
            staging-certification:
              name: Staging Certification
              uses: ./.github/workflows/staging-certification.yml
              secrets: inherit

            production:
              name: Production Release
              needs: staging-certification
              runs-on: ubuntu-latest
              environment: production

              steps:
                - name: Checkout
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

                - name: Enforce immutable release tag
                  shell: bash
                  run: |
                    set -Eeuo pipefail

                    if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
                      echo "Production release must originate from an immutable version tag." >&2
                      exit 1
                    fi

                    TAG="${GITHUB_REF#refs/tags/}"
                    VERSION="$(node -p "require('./backend/package.json').version")"

                    if [ "$TAG" != "v$VERSION" ]; then
                      echo "Release tag $TAG does not match application version v$VERSION" >&2
                      exit 1
                    fi

                - name: Verify Flutter lockfile
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    bash tools/verify-pubspec-lock-fresh.sh

                - name: Flutter dependencies
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    flutter pub get --enforce-lockfile

                - name: Flutter release tests
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    flutter test --no-pub

                - name: Production npm audit
                  working-directory: backend
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    npm audit --audit-level=high

                - name: Build production backend image
                  working-directory: backend
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    docker build --pull --file Dockerfile --tag hope-api:${GITHUB_SHA} .
          YAML

          echo 'PASS: canonical project workflows created.'

      - name: Verify canonical workflow set
        shell: bash
        run: |
          set -Eeuo pipefail

          required_workflows=(
            ".github/workflows/bootstrap.yml"
            ".github/workflows/main.yml"
            ".github/workflows/device-integration.yml"
            ".github/workflows/staging-certification.yml"
            ".github/workflows/production-release.yml"
          )

          for workflow in "${required_workflows[@]}"; do
            test -s "$workflow" || {
              echo "Missing required workflow: $workflow" >&2
              exit 1
            }
          done

          duplicate_bootstrap="$(
            find tools backend lib test integration_test \
              -type f \
              \( \
                -name 'bootstrap-v8.sh' \
                -o \
                -name 'bootstrap-dependencies.sh' \
              \) \
              -print 2>/dev/null || true
          )"

          if [ -n "$duplicate_bootstrap" ]; then
            echo 'Duplicate internal Bootstrap detected:' >&2
            printf '%s\n' "$duplicate_bootstrap" >&2
            exit 1
          fi

          python3 tools/check-workflows.py

          echo 'PASS: canonical workflow set and workflow contracts'

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Validate repository structure
        shell: bash
        run: |
          set -Eeuo pipefail

          required=(
            pubspec.yaml
            pubspec.lock
            backend/package.json
            backend/package-lock.json
            lib
            backend/src
            tools/check-workflows.py
            tools/verify-pubspec-lock-fresh.sh
            tools/ci-android-toolchain.sh
            tools/android-runtime-cert-contract.sh
            tools/staging-resilience-drill.sh
            tools/staging-operational-gate.mjs
            tools/staging-smoke.sh
          )

          for path in "${required[@]}"; do
            if [ ! -e "$path" ]; then
              echo "Missing required path: $path" >&2
              exit 1
            fi
          done

          python3 tools/check-workflows.py

          echo 'PASS: repository structure and workflow contracts'

      - name: Backend dependency install and core syntax
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci --ignore-scripts

          node --check src/server.js
          node --check src/app.js
          node --check src/db.js

          echo 'PASS: backend dependencies and core syntax'

      - name: Persistence boundary
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          ROUTES_DIR="src/routes"
          REPORT="$RUNNER_TEMP/hope-route-db-refs.txt"

          if [ ! -d "$ROUTES_DIR" ]; then
            echo "Missing routes directory: $ROUTES_DIR" >&2
            exit 1
          fi

          : > "$REPORT"

          set +e

          grep -RInE \
            --include='*.js' \
            'db\.(collection|insert|update|touch|reset|save)' \
            "$ROUTES_DIR" \
            > "$REPORT" \
            2>/dev/null

          grep_status=$?

          set -e

          if [ "$grep_status" -gt 1 ]; then
            echo "Persistence boundary grep failed with exit code $grep_status" >&2
            exit "$grep_status"
          fi

          refs="$(wc -l < "$REPORT" | tr -d ' ')"

          if [ "$refs" -ne 0 ]; then
            echo "Route persistence boundary broken: $refs direct db refs" >&2
            cat "$REPORT" >&2
            exit 1
          fi

          echo 'PASS: route persistence boundary = 0 direct db.* refs'

      - name: Backend fast and architecture gates
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run test:fast
          npm run test:contract
          npm run test:architecture-layers

      - name: Backend operational and product gates
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run test:backup
          npm run test:staging-contract
          npm run test:release-evidence
          npm run test:payment-e2e
          npm run test:notifications
          npm run test:analytics
          npm run test:wave10
          npm run test:product

      - name: Dependency audit
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm audit --audit-level=high

      - name: Flutter validation
        shell: bash
        run: |
          set -Eeuo pipefail

          version="$(
            flutter --version |
            sed -n '1s/Flutter \([^ ]*\).*/\1/p'
          )"

          if [ "$version" != "3.47.2" ]; then
            echo "Flutter 3.47.2 required; found ${version:-unknown}" >&2
            exit 1
          fi

          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --no-pub

          echo 'PASS: Flutter validation'

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hope-v8-bootstrap-report
          path: |
            backend/test-results/**
            test-results/**
          if-no-files-found: ignore
