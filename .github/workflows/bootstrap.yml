name: HOPE-V8 Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap-and-verify:
    name: Bootstrap and Verify HOPE-V8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Discover and safely extract project archive
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          TMP="$RUNNER_TEMP/hope-v8-bootstrap"
          EXTRACT="$TMP/extracted"

          rm -rf "$TMP"
          mkdir -p "$EXTRACT"

          mapfile -t ZIPS < <(
            find "$ROOT" \
              -maxdepth 2 \
              -type f \
              -iname '*.zip' \
              -not -path '*/.git/*' \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo 'No project ZIP found at repository root.' >&2
            exit 1
          fi

          mapfile -t HOPE_ZIPS < <(
            printf '%s\n' "${ZIPS[@]}" |
            grep -Ei '/(hope|v[0-9]+|release|final|source|build|session)[^/]*\.zip$' ||
            true
          )

          if [ "${#HOPE_ZIPS[@]}" -gt 0 ]; then
            ZIP="$(ls -1t "${HOPE_ZIPS[@]}" | head -n1)"
          else
            ZIP="$(ls -1t "${ZIPS[@]}" | head -n1)"
          fi

          echo "Using archive: $(basename "$ZIP")"

          # Reject path traversal and repository metadata.
          # .github is allowed inside an archive but is NEVER imported.
          while IFS= read -r entry; do
            entry="${entry//\\//}"

            case "$entry" in
              /*|../*|*/../*|*/..|.git|.git/*|*/.git/*)
                echo "Unsafe ZIP path: $entry" >&2
                exit 1
                ;;
            esac
          done < <(unzip -Z1 "$ZIP")

          unzip -q "$ZIP" -d "$EXTRACT"

          is_project_root() {
            [ -f "$1/pubspec.yaml" ] &&
            [ -f "$1/backend/package.json" ] &&
            [ -d "$1/lib" ] &&
            [ -d "$1/backend/src" ]
          }

          SRC=""

          if is_project_root "$EXTRACT"; then
            SRC="$EXTRACT"
          else
            while IFS= read -r pubspec; do
              candidate="$(dirname "$pubspec")"

              if is_project_root "$candidate"; then
                SRC="$candidate"
                break
              fi
            done < <(
              find "$EXTRACT" \
                -maxdepth 6 \
                -type f \
                -name pubspec.yaml \
                -print \
                | sort
            )
          fi

          [ -n "$SRC" ] || {
            echo 'No valid HOPE project root found in ZIP.' >&2
            exit 1
          }

          echo "Project root: ${SRC#$EXTRACT/}"

          # Remove previously imported project payload only.
          # The GitHub controller itself remains untouched.
          rm -rf \
            "$ROOT/backend" \
            "$ROOT/lib" \
            "$ROOT/android" \
            "$ROOT/ios" \
            "$ROOT/web" \
            "$ROOT/assets" \
            "$ROOT/test" \
            "$ROOT/integration_test" \
            "$ROOT/docs"

          # Import project contents while explicitly excluding .github.
          # GitHub remains the single source of truth for workflows.
          for item in \
            "$SRC"/* \
            "$SRC"/.[!.]* \
            "$SRC"/..?*
          do
            [ -e "$item" ] || continue

            base="${item##*/}"

            case "$base" in
              .github|.git)
                continue
                ;;
            esac

            cp -a "$item" "$ROOT/"
          done

          echo 'PASS: project imported; GitHub controller preserved.'

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Validate repository structure
        shell: bash
        run: |
          set -Eeuo pipefail

          required=(
            pubspec.yaml
            pubspec.lock
            backend/package.json
            backend/package-lock.json
            lib
            backend/src
            tools/check-workflows.py
          )

          for path in "${required[@]}"; do
            test -e "$path" || {
              echo "Missing required path: $path" >&2
              exit 1
            }
          done

          # There must be exactly one Bootstrap controller:
          # the one committed under .github/workflows.
          test -f .github/workflows/bootstrap.yml || {
            echo 'Missing GitHub Bootstrap controller.' >&2
            exit 1
          }

          # Internal Bootstrap controllers are forbidden.
          # Missing directories are harmless.
          duplicate_bootstrap="$(
            find tools backend lib test integration_test \
              -type f \
              \( \
                -name 'bootstrap-v8.sh' \
                -o -name 'bootstrap-dependencies.sh' \
              \) \
              -print 2>/dev/null || true
          )"

          if [ -n "$duplicate_bootstrap" ]; then
            echo 'Duplicate internal Bootstrap detected:' >&2
            printf '%s\n' "$duplicate_bootstrap" >&2
            exit 1
          fi

          python3 tools/check-workflows.py

          echo 'PASS: repository structure and workflow contracts'

      - name: Backend dependency install and core syntax
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci --ignore-scripts

          node --check src/server.js
          node --check src/app.js
          node --check src/db.js

          echo 'PASS: backend dependencies and core syntax'

      - name: Persistence boundary
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          ROUTES_DIR="src/routes"

          test -d "$ROUTES_DIR" || {
            echo "Missing routes directory: $ROUTES_DIR" >&2
            exit 1
          }

          refs="$(
            grep -RInE \
              --include='*.js' \
              'db\.(collection|insert|update|touch|reset|save)' \
              "$ROUTES_DIR" \
              2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          [ "$refs" -eq 0 ] || {
            echo "Route persistence boundary broken: $refs direct db refs" >&2
            exit 1
          }

          echo 'PASS: route persistence boundary = 0 direct db.* refs'

      - name: Backend fast and architecture gates
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run test:fast
          npm run test:contract
          npm run test:architecture-layers

      - name: Backend operational and product gates
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run test:backup
          npm run test:staging-contract
          npm run test:release-evidence
          npm run test:payment-e2e
          npm run test:notifications
          npm run test:analytics
          npm run test:wave10
          npm run test:product

      - name: Dependency audit
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm audit --audit-level=high

      - name: Flutter validation
        shell: bash
        run: |
          set -Eeuo pipefail

          version="$(
            flutter --version |
            sed -n '1s/Flutter \([^ ]*\).*/\1/p'
          )"

          [ "$version" = '3.47.2' ] || {
            echo "Flutter 3.47.2 required; found ${version:-unknown}" >&2
            exit 1
          }

          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --no-pub

          echo 'PASS: Flutter validation'

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hope-v8-bootstrap-report
          path: |
            backend/test-results/**
            test-results/**
          if-no-files-found: ignore
