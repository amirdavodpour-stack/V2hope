name: HOPE-V8 Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type release to allow production release"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
      - "HOPE-V8-CI-FIXED-15-executable-permissions.zip"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: hope-v8-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.47.2"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "28.2.13676358"
  SOURCE_ARCHIVE: "HOPE-V8-CI-FIXED-15-executable-permissions.zip"

jobs:

  bootstrap:
    name: Bootstrap and Verify HOPE-V8
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      app_version: ${{ steps.version.outputs.app_version }}

    steps:

      - name: Checkout bootstrap repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "${SOURCE_ARCHIVE}" ]]; then
            echo "::error::Required source archive is missing: ${SOURCE_ARCHIVE}"
            exit 1
          fi

          test -s "${SOURCE_ARCHIVE}"

          ls -lh "${SOURCE_ARCHIVE}"

      - name: Validate source archive paths
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import zipfile

          archive = "HOPE-V8-CI-FIXED-15-executable-permissions.zip"

          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  normalized = name.replace("\\", "/")

                  if normalized.startswith("/"):
                      raise SystemExit(f"Unsafe absolute ZIP path: {name}")

                  if ".." in normalized.split("/"):
                      raise SystemExit(f"Unsafe parent ZIP path: {name}")

                  if ".git" in normalized.split("/"):
                      raise SystemExit(f"Unsafe .git ZIP path: {name}")

          print("Source archive path validation: PASS")
          PY

      - name: Extract authoritative source
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf .hope-source
          mkdir -p .hope-source

          python3 - <<'PY'
          import zipfile

          archive = "HOPE-V8-CI-FIXED-15-executable-permissions.zip"

          with zipfile.ZipFile(archive) as z:
              z.extractall(".hope-source")
          PY

      - name: Locate authoritative project root
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_ROOT=""

          while IFS= read -r candidate; do
            if [[ -f "${candidate}/pubspec.yaml" ]] &&
               [[ -f "${candidate}/backend/package.json" ]] &&
               [[ -f "${candidate}/backend/package-lock.json" ]] &&
               [[ -d "${candidate}/backend/src" ]] &&
               [[ -d "${candidate}/lib" ]]; then
              PROJECT_ROOT="${candidate}"
              break
            fi
          done < <(
            find "${GITHUB_WORKSPACE}/.hope-source" \
              -type f \
              -name pubspec.yaml \
              -print \
              | sed 's#/pubspec.yaml$##' \
              | sort
          )

          if [[ -z "${PROJECT_ROOT}" ]]; then
            echo "::error::Unable to locate authoritative HOPE project root."
            find .hope-source -maxdepth 5 -type f | sort | head -500
            exit 1
          fi

          echo "project_root=${PROJECT_ROOT}" >> "${GITHUB_OUTPUT}"

          SOURCE_SHA="$(
            python3 - "${PROJECT_ROOT}" <<'PY'
          import hashlib
          import os
          import sys

          root = sys.argv[1]
          digest = hashlib.sha256()

          files = []

          for current, dirs, names in os.walk(root):
              dirs[:] = sorted(
                  d for d in dirs
                  if d not in {".git", ".dart_tool", "node_modules", "build"}
              )

              for name in sorted(names):
                  path = os.path.join(current, name)
                  rel = os.path.relpath(path, root)
                  files.append((rel.replace(os.sep, "/"), path))

          for rel, path in sorted(files):
              digest.update(rel.encode())
              digest.update(b"\0")

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)

          print(digest.hexdigest())
          PY
          )"

          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

          echo "Authoritative project root:"
          echo "${PROJECT_ROOT}"
          echo "Source SHA:"
          echo "${SOURCE_SHA}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ steps.source.outputs.project_root }}/backend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ------------------------------------------------------------
      # IMPORTANT:
      # agent-preflight.sh is executed FROM THE AUTHORITATIVE SOURCE
      # ROOT, where staging-certification.yml actually exists.
      #
      # We do NOT remove/patch/skip its contract.
      # ------------------------------------------------------------

      - name: Authoritative agent preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/agent-preflight.sh

      - name: Authoritative workflow validation
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 tools/check-workflows.py

      - name: Authoritative static audit
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/static_audit.sh

      - name: Authoritative Node syntax validation
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          node --check backend/src/*.js

      - name: Authoritative runtime certification preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/runtime-certification-preflight.sh

      - name: Authoritative Android build preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/android-build-preflight.sh

      - name: Import authoritative source into workspace
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "${PROJECT_ROOT}/pubspec.yaml"
          test -f "${PROJECT_ROOT}/backend/package.json"

          mkdir -p .bootstrap-preserve

          if [[ -d .github ]]; then
            cp -a .github .bootstrap-preserve/.github
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".hope-source" \
            ! -name ".bootstrap-preserve" \
            -exec rm -rf {} +

          cp -a "${PROJECT_ROOT}/." .

          if [[ -d .bootstrap-preserve/.github ]]; then
            rm -rf .github
            cp -a .bootstrap-preserve/.github .github
          fi

          test -f pubspec.yaml
          test -f backend/package.json
          test -f backend/package-lock.json
          test -d backend/src
          test -d lib

      - name: Restore executable permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          find . -type f -name "*.sh" -print0 | xargs -0 chmod +x
          chmod +x android/gradlew

          test -x android/gradlew

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci

      - name: Backend authoritative checks
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run check:all

      - name: Flutter dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get --enforce-lockfile

      - name: Verify pubspec lock freshness
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/verify-pubspec-lock-fresh.sh

      - name: Flutter analyze
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter analyze

      - name: Flutter tests
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter test --no-pub

      - name: Capture application version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_VERSION="$(
            python3 - <<'PY'
          import re

          text = open("pubspec.yaml", encoding="utf-8").read()
          match = re.search(r"^version:\s*([^\s]+)", text, re.MULTILINE)

          if not match:
              raise SystemExit("Unable to determine application version")

          print(match.group(1).split("+")[0])
          PY
          )"

          test -n "${APP_VERSION}"

          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap verification receipt
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "HOPE-V8 BOOTSTRAP: PASS"
          echo "SOURCE SHA: ${{ steps.source.outputs.source_sha }}"
          echo "GIT SHA: ${GITHUB_SHA}"
          echo "APP VERSION: ${{ steps.version.outputs.app_version }}"
          echo "========================================"


  staging:
    name: Staging Certification
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 140

    outputs:
      certification_status: ${{ steps.emit_status.outputs.status }}
      certification_sha: ${{ github.sha }}
      certification_attempt: ${{ github.run_attempt }}
      certification_run_id: ${{ github.run_id }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: hope
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hope"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio123456
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://127.0.0.1:9000/minio/health/live"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:

      - name: Checkout bootstrap repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s "${SOURCE_ARCHIVE}"

      - name: Extract authoritative source
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf .hope-source
          mkdir -p .hope-source

          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile("HOPE-V8-CI-FIXED-15-executable-permissions.zip") as z:
              z.extractall(".hope-source")
          PY

      - name: Locate source root
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_ROOT=""

          while IFS= read -r candidate; do
            if [[ -f "${candidate}/pubspec.yaml" ]] &&
               [[ -f "${candidate}/backend/package.json" ]] &&
               [[ -f "${candidate}/backend/package-lock.json" ]] &&
               [[ -d "${candidate}/backend/src" ]] &&
               [[ -d "${candidate}/lib" ]]; then
              PROJECT_ROOT="${candidate}"
              break
            fi
          done < <(
            find .hope-source -type f -name pubspec.yaml -print \
              | sed 's#/pubspec.yaml$##' \
              | sort
          )

          test -n "${PROJECT_ROOT}"

          echo "project_root=${PROJECT_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Import authoritative source
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .bootstrap-preserve

          if [[ -d .github ]]; then
            cp -a .github .bootstrap-preserve/.github
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".hope-source" \
            ! -name ".bootstrap-preserve" \
            -exec rm -rf {} +

          cp -a "${PROJECT_ROOT}/." .

          if [[ -d .bootstrap-preserve/.github ]]; then
            rm -rf .github
            cp -a .bootstrap-preserve/.github .github
          fi

      - name: Restore executable permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          find . -type f -name "*.sh" -print0 | xargs -0 chmod +x
          chmod +x android/gradlew

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: CI resource guard
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/ci-resource-guard.sh

      - name: Android CI toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/ci-android-toolchain.sh

      - name: Runtime certification preflight
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          bash ../tools/runtime-certification-preflight.sh

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci

      - name: Flutter dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get --enforce-lockfile

      - name: Verify pubspec lock freshness
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/verify-pubspec-lock-fresh.sh

      - name: Flutter unit tests
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter test --no-pub

      - name: PostgreSQL runtime probe
        id: postgres_probe
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope
          REQUIRE_INTEGRATION: "1"
        run: |
          set -Eeuo pipefail

          npm run test:postgres

      - name: S3 runtime probe
        id: s3_probe
        working-directory: backend
        shell: bash
        env:
          S3_INTEGRATION: "1"
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REQUIRE_HTTPS: "0"
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio123456
        run: |
          set -Eeuo pipefail

          npm run test:s3

      - name: Staging performance smoke
        id: perf_probe
        working-directory: backend
        shell: bash
        env:
          PERF_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PERF_REQUESTS: "500"
          PERF_CONCURRENCY: "50"
          PERF_P95_BUDGET_MS: "500"
          PERF_P99_BUDGET_MS: "1000"
          PERF_MAX_5XX_RATE: "0.01"
        run: |
          set -Eeuo pipefail

          test -n "${PERF_BASE_URL}"

          node tools/perf-smoke.mjs
          test -s perf-smoke.json

      - name: Staging product workflow
        id: product_workflow
        working-directory: backend
        shell: bash
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -Eeuo pipefail

          test -n "${STAGING_BASE_URL}"

          node ../tools/staging-product-smoke.mjs

      - name: Staging external provider integration
        id: provider_integration
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run test:provider

      - name: Probe notification delivery
        id: notification_delivery
        if: >
          env.NOTIFICATION_PROVIDER_TOKEN != '' &&
          (env.NOTIFICATION_PUSH_URL != '' || env.NOTIFICATION_EMAIL_URL != '')
        working-directory: backend
        shell: bash
        env:
          NOTIFICATION_PUSH_URL: ${{ secrets.NOTIFICATION_PUSH_URL }}
          NOTIFICATION_EMAIL_URL: ${{ secrets.NOTIFICATION_EMAIL_URL }}
          NOTIFICATION_PROVIDER_TOKEN: ${{ secrets.NOTIFICATION_PROVIDER_TOKEN }}
        run: |
          set -Eeuo pipefail

          node ../tools/staging-notification-delivery.mjs \
            | tee "$RUNNER_TEMP/staging-notification-delivery.log"

      - name: Android quality gates
        id: android_quality
        timeout-minutes: 30
        shell: bash
        env:
          API_BASE_URL: https://staging.api.hope.app
          BUILD_PROFILE: pilot
        run: |
          set -Eeuo pipefail

          bash tools/build_apk_debug.sh

      - name: Android emulator certification
        id: device_certification
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        env:
          API_BASE_URL_STAGING: https://staging.api.hope.app
          CI_DEVICE_INTEGRATION: "true"
        with:
          api-level: 35
          arch: x86_64
          script: |
            flutter test --no-pub integration_test

      - name: DR restore drill
        id: dr_drill
        working-directory: backend
        shell: bash
        env:
          SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope
          DRILL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope
          DRILL_WORK_DIR: /tmp/hope-dr-drill
          DRILL_EVIDENCE_FILE: /tmp/hope-dr-drill/dr-restore-evidence.json
        run: |
          set -Eeuo pipefail

          bash ../scripts/dr-restore-drill.sh
          test -s "$DRILL_EVIDENCE_FILE"

      - name: Runtime evidence - PostgreSQL
        if: ${{ always() }}
        working-directory: backend
        shell: bash
        env:
          GATE_RESULT: ${{ steps.postgres_probe.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          node tools/write-evidence.mjs \
            --gate postgres_runtime \
            --result "$GATE_RESULT"

      - name: Runtime evidence - S3
        if: ${{ always() }}
        working-directory: backend
        shell: bash
        env:
          GATE_RESULT: ${{ steps.s3_probe.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          node tools/write-evidence.mjs \
            --gate s3_runtime \
            --result "$GATE_RESULT"

      - name: Runtime evidence - performance
        if: ${{ always() }}
        working-directory: backend
        shell: bash
        env:
          GATE_RESULT: ${{ steps.perf_probe.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          node tools/write-evidence.mjs \
            --gate perf_run \
            --result "$GATE_RESULT"

      - name: Runtime evidence - device
        if: ${{ always() }}
        working-directory: backend
        shell: bash
        env:
          GATE_RESULT: ${{ steps.device_certification.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          node tools/write-evidence.mjs \
            --gate device_certification \
            --result "$GATE_RESULT"

      - name: Runtime evidence - DR
        if: ${{ always() }}
        working-directory: backend
        shell: bash
        env:
          GATE_RESULT: ${{ steps.dr_drill.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          node tools/write-evidence.mjs \
            --gate dr_restore \
            --result "$GATE_RESULT"

      - name: Runtime evidence - provider
        if: ${{ always() }}
        working-directory: backend
        shell: bash
        env:
          GATE_RESULT: ${{ steps.provider_integration.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          node tools/write-evidence.mjs \
            --gate provider_runtime \
            --result "$GATE_RESULT"

      - name: Upload staging certification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-certification-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staging-notification-delivery.log
            backend/perf-smoke.json
            /tmp/hope-dr-drill/**
          if-no-files-found: warn

      - name: Staging operational gate
        id: emit_status
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          status=fail

          if \
            [[ "${{ steps.postgres_probe.outcome }}" == "success" ]] &&
            [[ "${{ steps.s3_probe.outcome }}" == "success" ]] &&
            [[ "${{ steps.perf_probe.outcome }}" == "success" ]] &&
            [[ "${{ steps.product_workflow.outcome }}" == "success" ]] &&
            [[ "${{ steps.provider_integration.outcome }}" == "success" ]] &&
            [[ "${{ steps.android_quality.outcome }}" == "success" ]] &&
            [[ "${{ steps.device_certification.outcome }}" == "success" ]] &&
            [[ "${{ steps.dr_drill.outcome }}" == "success" ]] &&
            { \
              [[ "${{ steps.notification_delivery.outcome }}" == "success" ]] ||
              [[ "${{ steps.notification_delivery.outcome }}" == "skipped" ]]; \
            }
          then
            status=pass
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Emit certification status
        if: ${{ always() }}
        run: |
          echo "Certification status: ${{ steps.emit_status.outputs.status }}"


  production:
    name: Production Release
    needs:
      - bootstrap
      - staging
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'release' &&
      needs.staging.outputs.certification_status == 'pass' &&
      github.ref_type == 'tag'

    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 140

    steps:

      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s "${SOURCE_ARCHIVE}"

      - name: Extract authoritative source
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf .hope-source
          mkdir -p .hope-source

          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile("HOPE-V8-CI-FIXED-15-executable-permissions.zip") as z:
              z.extractall(".hope-source")
          PY

      - name: Locate source root
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_ROOT=""

          while IFS= read -r candidate; do
            if [[ -f "${candidate}/pubspec.yaml" ]] &&
               [[ -f "${candidate}/backend/package.json" ]] &&
               [[ -f "${candidate}/backend/package-lock.json" ]] &&
               [[ -d "${candidate}/backend/src" ]] &&
               [[ -d "${candidate}/lib" ]]; then
              PROJECT_ROOT="${candidate}"
              break
            fi
          done < <(
            find .hope-source -type f -name pubspec.yaml -print \
              | sed 's#/pubspec.yaml$##' \
              | sort
          )

          test -n "${PROJECT_ROOT}"

          echo "project_root=${PROJECT_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Import authoritative source
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .bootstrap-preserve

          if [[ -d .github ]]; then
            cp -a .github .bootstrap-preserve/.github
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".hope-source" \
            ! -name ".bootstrap-preserve" \
            -exec rm -rf {} +

          cp -a "${PROJECT_ROOT}/." .

          if [[ -d .bootstrap-preserve/.github ]]; then
            rm -rf .github
            cp -a .bootstrap-preserve/.github .github
          fi

      - name: Restore executable permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          find . -type f -name "*.sh" -print0 | xargs -0 chmod +x
          chmod +x android/gradlew

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify exact release confirmation
        shell: bash
        run: |
          set -Eeuo pipefail

          test "${{ inputs.confirm }}" = "release"

      - name: Verify staging certification identity
        shell: bash
        run: |
          set -Eeuo pipefail

          test "${{ needs.staging.outputs.certification_status }}" = "pass"
          test "${{ needs.staging.outputs.certification_sha }}" = "${GITHUB_SHA}"

      - name: Verify immutable semantic version tag
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production release requires tag vX.Y.Z."
            exit 1
          fi

          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"

          test "${TAG_SHA}" = "${GITHUB_SHA}"

      - name: CI Android toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/ci-android-toolchain.sh

      - name: Android build preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/android-build-preflight.sh

      - name: Verify production environment
        shell: bash
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          S3_BUCKET_PRODUCTION: ${{ secrets.S3_BUCKET_PRODUCTION }}
          S3_REGION_PRODUCTION: ${{ secrets.S3_REGION_PRODUCTION }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ACCESS_TOKEN_SECRET_PRODUCTION: ${{ secrets.ACCESS_TOKEN_SECRET_PRODUCTION }}
          REFRESH_TOKEN_SECRET_PRODUCTION: ${{ secrets.REFRESH_TOKEN_SECRET_PRODUCTION }}
          METRICS_TOKEN_PRODUCTION: ${{ secrets.METRICS_TOKEN_PRODUCTION }}
          PAYMENT_WEBHOOK_SECRET_PRODUCTION: ${{ secrets.PAYMENT_WEBHOOK_SECRET_PRODUCTION }}
          PAYMENT_PROVIDER_TOKEN_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_TOKEN_PRODUCTION }}
          PAYMENT_PROVIDER_CREATE_URL_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_CREATE_URL_PRODUCTION }}
          PAYMENT_PROVIDER_RELEASE_URL_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_RELEASE_URL_PRODUCTION }}
          PAYMENT_PROVIDER_REFUND_URL_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_REFUND_URL_PRODUCTION }}
          ALLOWED_CORS_ORIGINS_PRODUCTION: ${{ secrets.ALLOWED_CORS_ORIGINS_PRODUCTION }}
          RESET_TOKEN_DELIVERY_URL_PRODUCTION: ${{ secrets.RESET_TOKEN_DELIVERY_URL_PRODUCTION }}
          RESET_TOKEN_DELIVERY_SECRET_PRODUCTION: ${{ secrets.RESET_TOKEN_DELIVERY_SECRET_PRODUCTION }}
        run: |
          set -Eeuo pipefail

          required=(
            DATABASE_URL_PRODUCTION
            S3_BUCKET_PRODUCTION
            S3_REGION_PRODUCTION
            PUBLIC_BASE_URL
            ACCESS_TOKEN_SECRET_PRODUCTION
            REFRESH_TOKEN_SECRET_PRODUCTION
            METRICS_TOKEN_PRODUCTION
            PAYMENT_WEBHOOK_SECRET_PRODUCTION
            PAYMENT_PROVIDER_TOKEN_PRODUCTION
            PAYMENT_PROVIDER_CREATE_URL_PRODUCTION
            PAYMENT_PROVIDER_RELEASE_URL_PRODUCTION
            PAYMENT_PROVIDER_REFUND_URL_PRODUCTION
            ALLOWED_CORS_ORIGINS_PRODUCTION
            RESET_TOKEN_DELIVERY_URL_PRODUCTION
            RESET_TOKEN_DELIVERY_SECRET_PRODUCTION
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production secret: ${name}"
              exit 1
            fi
          done

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci

      - name: Full production checks
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run check:all

      - name: Production security audit
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm audit --audit-level=high

      - name: Generate SBOM
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run sbom

      - name: Flutter production validation
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get --enforce-lockfile
          bash tools/verify-pubspec-lock-fresh.sh
          flutter analyze
          flutter test --no-pub

      - name: Docker build verification
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail

          docker build -t "hope-backend:${GITHUB_SHA}" .

          BACKEND_IMAGE_ID="$(
            docker image inspect \
              "hope-backend:${GITHUB_SHA}" \
              --format '{{.Id}}'
          )"

          test -n "${BACKEND_IMAGE_ID}"

          echo "BACKEND_IMAGE_ID=${BACKEND_IMAGE_ID}" >> "${GITHUB_ENV}"

      - name: Prepare production keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -Eeuo pipefail

          test -n "${ANDROID_RELEASE_KEYSTORE_B64}"

          mkdir -p android/app

          printf '%s' "${ANDROID_RELEASE_KEYSTORE_B64}" \
            | base64 --decode \
            > android/app/release-keystore.jks

          chmod 600 android/app/release-keystore.jks

          test -s android/app/release-keystore.jks

      - name: Build production APK
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL_PRODUCTION }}
          BUILD_PROFILE: production
          ANDROID_KEYSTORE_PATH: android/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail

          test -n "${API_BASE_URL}"

          bash tools/build_apk_release.sh

      - name: Verify production APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find artifacts -type f -name "*.apk" | head -n 1)"

          test -n "${APK}"
          test -s "${APK}"

          SIZE="$(stat -c '%s' "${APK}")"

          if (( SIZE <= 1048576 )); then
            echo "::error::APK is unexpectedly small: ${SIZE} bytes"
            exit 1
          fi

          apksigner verify --verbose "${APK}"

          sha256sum "${APK}" | tee artifacts/production-apk.sha256

      - name: Write Android release evidence
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts/release

          APK="$(find artifacts -type f -name "*.apk" | head -n 1)"
          APK_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"

          python3 - "${APK}" "${APK_SHA256}" "${BACKEND_IMAGE_ID}" <<'PY'
          import json
          import sys

          apk, apk_sha256, image_id = sys.argv[1:4]

          data = {
              "status": "PASS",
              "sha": "${GITHUB_SHA}",
              "run_id": "${GITHUB_RUN_ID}",
              "attempt": int("${GITHUB_RUN_ATTEMPT}"),
              "apk": apk,
              "sha256": apk_sha256,
              "backend_image_id": image_id,
          }

          with open("artifacts/release/android-build.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Generate release manifest
        working-directory: backend
        shell: bash
        env:
          STAGING_CERTIFICATION_STATUS: PASS
          STAGING_CERTIFICATION_RUN_ID: ${{ needs.staging.outputs.certification_run_id }}
          STAGING_CERTIFICATION_SHA: ${{ needs.staging.outputs.certification_sha }}
          STAGING_CERTIFICATION_ATTEMPT: ${{ needs.staging.outputs.certification_attempt }}
          BACKEND_IMAGE_ID: ${{ env.BACKEND_IMAGE_ID }}
          BACKEND_IMAGE_REF: hope-backend:${{ github.sha }}
        run: |
          set -Eeuo pipefail

          npm run release:manifest

      - name: Verify release manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s backend/release-manifest.json

          python3 - <<'PY'
          import json

          path = "backend/release-manifest.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("staging_certification_status") != "PASS":
              raise SystemExit(
                  "Release manifest staging certification status is not PASS"
              )

          if data.get("staging_certification_sha") != "${GITHUB_SHA}":
              raise SystemExit(
                  "Release manifest staging certification SHA mismatch"
              )

          print("Release manifest verification: PASS")
          PY

      - name: Upload production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hope-v8-production-release-${{ github.ref_name }}
          path: |
            artifacts/**
            backend/release-manifest.json
            backend/*.spdx
          if-no-files-found: error

      - name: Attest production build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: artifacts/**/*.apk

      - name: Cleanup production keystore
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f android/app/release-keystore.jks

      - name: Production release complete
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "HOPE-V8 PRODUCTION RELEASE: PASS"
          echo "TAG: ${GITHUB_REF_NAME}"
          echo "SHA: ${GITHUB_SHA}"
          echo "STAGING: PASS"
          echo "========================================"
