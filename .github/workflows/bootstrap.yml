name: HOPE-V8 Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Production release confirmation. Type release only when intentionally verifying production."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: hope-v8-bootstrap
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.47.2"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  PERF_P95_BUDGET_MS: "500"
  PERF_P99_BUDGET_MS: "1000"
  PERF_MAX_5XX_RATE: "0.01"

jobs:

  bootstrap:
    name: Bootstrap and Verify HOPE-V8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      source_root: ${{ steps.source.outputs.project_root }}

    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Locate source archive
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          archives=(./*.zip)

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "BOOTSTRAP_FAIL: no source ZIP found."
            exit 10
          fi

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "BOOTSTRAP_FAIL: expected exactly one source ZIP."
            printf ' - %s\n' "${archives[@]}"
            exit 10
          fi

          echo "archive=${archives[0]}"
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract source archive
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="${{ steps.archive.outputs.archive }}"
          SOURCE_ROOT="$RUNNER_TEMP/hope-source"

          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

          unzip -q "$ARCHIVE" -d "$SOURCE_ROOT"

          echo "=== EXTRACTED SOURCE ==="
          find "$SOURCE_ROOT" -maxdepth 4 -type f | sort | head -300

          PROJECT_ROOT=""

          if [ -f "$SOURCE_ROOT/pubspec.yaml" ] &&
             [ -f "$SOURCE_ROOT/backend/package.json" ]; then
            PROJECT_ROOT="$SOURCE_ROOT"
          else
            while IFS= read -r candidate; do
              if [ -f "$candidate/pubspec.yaml" ] &&
                 [ -f "$candidate/backend/package.json" ]; then
                PROJECT_ROOT="$candidate"
                break
              fi
            done < <(find "$SOURCE_ROOT" -type f -name pubspec.yaml -print)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "BOOTSTRAP_FAIL: could not locate project root containing pubspec.yaml and backend/package.json."
            exit 11
          fi

          echo "project_root=$PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          chmod +x "$PROJECT_ROOT/android/gradlew" 2>/dev/null || true

          if [ -d "$PROJECT_ROOT/tools" ]; then
            find "$PROJECT_ROOT/tools" \
              -type f \
              -name '*.sh' \
              -exec chmod +x {} \;
          fi

          if [ -d "$PROJECT_ROOT/scripts" ]; then
            find "$PROJECT_ROOT/scripts" \
              -type f \
              -name '*.sh' \
              -exec chmod +x {} \;
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install and validate Android toolchain
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/ci-android-toolchain.sh

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/emulator"
            echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          } >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          echo "=== ANDROID TOOLCHAIN ==="
          command -v adb
          adb version
          command -v sdkmanager
          sdkmanager --version

          bash tools/android-build-preflight.sh

      - name: Agent preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/agent-preflight.sh

      - name: Validate GitHub Actions workflows
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f tools/check-workflows.py

          python3 tools/check-workflows.py

      - name: Static audit
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/static_audit.sh

      - name: Backend dependency installation
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Backend syntax checks
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check

      - name: Dependency audit
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm audit --audit-level=high

      - name: Flutter dependencies
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get
          bash tools/verify-pubspec-lock-fresh.sh

      - name: Flutter analyze
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter analyze

      - name: Flutter tests
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter test --no-pub

      - name: Backend authoritative test suite
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:all

      - name: Runtime certification preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          command -v adb
          adb version

          bash tools/runtime-certification-preflight.sh

      - name: Bootstrap verification summary
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "HOPE-V8 BOOTSTRAP PASS"
          echo "=========================================="
          echo "Node:    $(node --version)"
          echo "Java:    $(java -version 2>&1 | head -1)"
          echo "Flutter: $(flutter --version | head -1)"
          echo "ADB:     $(adb version | head -1)"
          echo "Source:  ${{ steps.source.outputs.project_root }}"
          echo "=========================================="

  staging:
    name: Staging Certification
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    outputs:
      certification_status: ${{ steps.certification.outputs.status }}
      certification_sha: ${{ steps.certification.outputs.sha }}
      certification_run_id: ${{ steps.certification.outputs.run_id }}
      certification_attempt: ${{ steps.certification.outputs.attempt }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: hope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: miniosecret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        command: server /data

    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Locate source archive
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob
          archives=(./*.zip)

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "STAGING_FAIL: expected exactly one source ZIP."
            printf '%s\n' "${archives[@]}"
            exit 20
          fi

          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract source archive
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_ROOT="$RUNNER_TEMP/hope-source"

          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

          unzip -q "${{ steps.archive.outputs.archive }}" -d "$SOURCE_ROOT"

          PROJECT_ROOT=""

          if [ -f "$SOURCE_ROOT/pubspec.yaml" ] &&
             [ -f "$SOURCE_ROOT/backend/package.json" ]; then
            PROJECT_ROOT="$SOURCE_ROOT"
          else
            while IFS= read -r candidate; do
              if [ -f "$candidate/pubspec.yaml" ] &&
                 [ -f "$candidate/backend/package.json" ]; then
                PROJECT_ROOT="$candidate"
                break
              fi
            done < <(find "$SOURCE_ROOT" -type f -name pubspec.yaml -print)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "STAGING_FAIL: project root not found."
            exit 21
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          chmod +x "$PROJECT_ROOT/android/gradlew" 2>/dev/null || true

          if [ -d "$PROJECT_ROOT/tools" ]; then
            find "$PROJECT_ROOT/tools" \
              -type f \
              -name '*.sh' \
              -exec chmod +x {} \;
          fi

          if [ -d "$PROJECT_ROOT/scripts" ]; then
            find "$PROJECT_ROOT/scripts" \
              -type f \
              -name '*.sh' \
              -exec chmod +x {} \;
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android toolchain
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/ci-android-toolchain.sh

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/emulator"
            echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          } >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          command -v adb
          adb version

          bash tools/android-build-preflight.sh

      - name: Agent preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/agent-preflight.sh

      - name: Validate workflow graph
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/check-workflows.py

      - name: Backend dependencies
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Flutter dependencies
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get
          bash tools/verify-pubspec-lock-fresh.sh

      - name: Flutter tests
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter test --no-pub

      - name: Postgres runtime certification
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope
          REQUIRE_INTEGRATION: "1"
        shell: bash
        run: |
          set -Eeuo pipefail

          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d hope; then
              break
            fi
            sleep 2
          done

          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d hope
          npm run test:postgres

      - name: S3 runtime certification
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          S3_INTEGRATION: "1"
          STAGING_S3_ENDPOINT: http://127.0.0.1:9000
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REQUIRE_HTTPS: "0"
        shell: bash
        run: |
          set -Eeuo pipefail

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null

          npm run test:s3

      - name: Staging performance smoke
        if: ${{ vars.STAGING_BASE_URL != '' }}
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          PERF_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PERF_REQUESTS: "500"
          PERF_CONCURRENCY: "50"
          PERF_P95_BUDGET_MS: ${{ env.PERF_P95_BUDGET_MS }}
          PERF_P99_BUDGET_MS: ${{ env.PERF_P99_BUDGET_MS }}
          PERF_MAX_5XX_RATE: ${{ env.PERF_MAX_5XX_RATE }}
        shell: bash
        run: |
          set -Eeuo pipefail

          node tools/perf-smoke.mjs
          test -s perf-smoke.json

      - name: Staging product smoke
        if: ${{ vars.STAGING_BASE_URL != '' }}
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node ../tools/staging-product-smoke.mjs

      - name: Provider integration certification
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run test:provider

      - name: Notification delivery certification
        id: notification
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          STAGING_NOTIFICATION_TOKEN: ${{ secrets.STAGING_NOTIFICATION_TOKEN }}
          STAGING_PUSH_URL: ${{ secrets.STAGING_PUSH_URL }}
          STAGING_EMAIL_URL: ${{ secrets.STAGING_EMAIL_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${STAGING_NOTIFICATION_TOKEN:-}" ]; then
            echo "Notification delivery certification skipped: token is not configured."
            exit 0
          fi

          if [ -z "${STAGING_PUSH_URL:-}" ] && [ -z "${STAGING_EMAIL_URL:-}" ]; then
            echo "Notification delivery certification skipped: neither push nor email endpoint is configured."
            exit 0
          fi

          node ../tools/staging-notification-delivery.mjs \
            | tee staging-notification-delivery.txt

          test -s staging-notification-delivery.txt

      - name: Android debug certification
        working-directory: ${{ steps.source.outputs.project_root }}
        env:
          API_BASE_URL: https://staging.api.hope.app
          BUILD_PROFILE: pilot
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/build_apk_debug.sh

      - name: Android emulator certification
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          working-directory: ${{ steps.source.outputs.project_root }}
          script: flutter test --no-pub integration_test
        env:
          API_BASE_URL_STAGING: https://staging.api.hope.app
          CI_DEVICE_INTEGRATION: "true"

      - name: DR restore drill
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          DR_SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope
          DR_TARGET_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ../scripts/dr-restore-drill.sh

      - name: Runtime certification preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          command -v adb
          adb version

          bash tools/runtime-certification-preflight.sh

      - name: Staging certification gate
        id: certification
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -Eeuo pipefail

          STATUS="pass"

          if [ -z "${STAGING_BASE_URL:-}" ]; then
            echo "STAGING_BASE_URL is not configured."
            echo "Performance/product runtime certification cannot be proven."
            STATUS="fail"
          fi

          if [ "$STATUS" != "pass" ]; then
            echo "STAGING_CERTIFICATION_FAIL"
            exit 30
          fi

          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "STAGING CERTIFICATION PASS"
          echo "sha=$RELEASE_SHA"
          echo "run_id=$GITHUB_RUN_ID"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          echo "=========================================="

  production:
    name: Production Release Verification
    needs:
      - bootstrap
      - staging
    if: ${{ needs.staging.result == 'success' && needs.staging.outputs.certification_status == 'pass' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Locate source archive
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob
          archives=(./*.zip)

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "PRODUCTION_FAIL: expected exactly one source ZIP."
            printf '%s\n' "${archives[@]}"
            exit 40
          fi

          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract source archive
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_ROOT="$RUNNER_TEMP/hope-source"

          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

          unzip -q "${{ steps.archive.outputs.archive }}" -d "$SOURCE_ROOT"

          PROJECT_ROOT=""

          if [ -f "$SOURCE_ROOT/pubspec.yaml" ] &&
             [ -f "$SOURCE_ROOT/backend/package.json" ]; then
            PROJECT_ROOT="$SOURCE_ROOT"
          else
            while IFS= read -r candidate; do
              if [ -f "$candidate/pubspec.yaml" ] &&
                 [ -f "$candidate/backend/package.json" ]; then
                PROJECT_ROOT="$candidate"
                break
              fi
            done < <(find "$SOURCE_ROOT" -type f -name pubspec.yaml -print)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "PRODUCTION_FAIL: project root not found."
            exit 41
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          chmod +x "$PROJECT_ROOT/android/gradlew" 2>/dev/null || true

          if [ -d "$PROJECT_ROOT/tools" ]; then
            find "$PROJECT_ROOT/tools" \
              -type f \
              -name '*.sh' \
              -exec chmod +x {} \;
          fi

          if [ -d "$PROJECT_ROOT/scripts" ]; then
            find "$PROJECT_ROOT/scripts" \
              -type f \
              -name '*.sh' \
              -exec chmod +x {} \;
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android toolchain
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bash tools/ci-android-toolchain.sh

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/emulator"
            echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          } >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          command -v adb
          adb version

          bash tools/android-build-preflight.sh

      - name: Agent preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/agent-preflight.sh

      - name: Validate workflow graph
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/check-workflows.py

      - name: Verify release confirmation
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail

          echo "Production verification reached."
          echo "Target SHA: $GITHUB_SHA"

      - name: Verify staging certification identity
        shell: bash
        env:
          STAGING_STATUS: ${{ needs.staging.outputs.certification_status }}
          STAGING_SHA: ${{ needs.staging.outputs.certification_sha }}
          STAGING_RUN_ID: ${{ needs.staging.outputs.certification_run_id }}
          STAGING_ATTEMPT: ${{ needs.staging.outputs.certification_attempt }}
        run: |
          set -Eeuo pipefail

          test "$STAGING_STATUS" = "pass"

          if [ "$STAGING_SHA" != "$GITHUB_SHA" ]; then
            echo "PRODUCTION_FAIL: staging SHA does not equal release SHA."
            echo "staging=$STAGING_SHA"
            echo "release=$GITHUB_SHA"
            exit 50
          fi

          test -n "$STAGING_RUN_ID"
          test -n "$STAGING_ATTEMPT"

      - name: Verify immutable semantic tag
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="$(
            python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")

          match = re.search(
              r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+(?:\+[0-9]+)?)\s*$",
              text,
              re.MULTILINE,
          )

          if not match:
              raise SystemExit("PRODUCTION_FAIL: pubspec version not found.")

          print(match.group(1).split("+", 1)[0])
          PY
          )"

          TAG="v$VERSION"

          git fetch --tags --force

          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "PRODUCTION_FAIL: required immutable tag $TAG does not exist."
            exit 51
          fi

          TAG_SHA="$(git rev-list -n 1 "refs/tags/$TAG")"

          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "PRODUCTION_FAIL: tag $TAG does not point to GITHUB_SHA."
            echo "tag=$TAG_SHA"
            echo "release=$GITHUB_SHA"
            exit 52
          fi

          echo "Verified immutable tag: $TAG"
          echo "Verified SHA: $GITHUB_SHA"

      - name: Backend dependencies
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: SBOM
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run sbom

      - name: Authoritative backend checks
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:all

      - name: Production dependency audit
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm audit --audit-level=high

      - name: Flutter dependencies and lock verification
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get --enforce-lockfile
          bash tools/verify-pubspec-lock-fresh.sh

      - name: Flutter analysis
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter analyze

      - name: Flutter tests
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter test --no-pub

      - name: Runtime certification preflight
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          command -v adb
          adb version

          bash tools/runtime-certification-preflight.sh

      - name: Production environment validation
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          S3_BUCKET_PRODUCTION: ${{ secrets.S3_BUCKET_PRODUCTION }}
          S3_REGION_PRODUCTION: ${{ secrets.S3_REGION_PRODUCTION }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ACCESS_TOKEN_SECRET_PRODUCTION: ${{ secrets.ACCESS_TOKEN_SECRET_PRODUCTION }}
          REFRESH_TOKEN_SECRET_PRODUCTION: ${{ secrets.REFRESH_TOKEN_SECRET_PRODUCTION }}
          METRICS_TOKEN_PRODUCTION: ${{ secrets.METRICS_TOKEN_PRODUCTION }}
          PAYMENT_WEBHOOK_SECRET_PRODUCTION: ${{ secrets.PAYMENT_WEBHOOK_SECRET_PRODUCTION }}
          PAYMENT_PROVIDER_TOKEN_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_TOKEN_PRODUCTION }}
          PAYMENT_PROVIDER_CREATE_URL_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_CREATE_URL_PRODUCTION }}
          PAYMENT_PROVIDER_RELEASE_URL_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_RELEASE_URL_PRODUCTION }}
          PAYMENT_PROVIDER_REFUND_URL_PRODUCTION: ${{ secrets.PAYMENT_PROVIDER_REFUND_URL_PRODUCTION }}
          ALLOWED_CORS_ORIGINS_PRODUCTION: ${{ secrets.ALLOWED_CORS_ORIGINS_PRODUCTION }}
          RESET_TOKEN_DELIVERY_URL_PRODUCTION: ${{ secrets.RESET_TOKEN_DELIVERY_URL_PRODUCTION }}
          RESET_TOKEN_DELIVERY_SECRET_PRODUCTION: ${{ secrets.RESET_TOKEN_DELIVERY_SECRET_PRODUCTION }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run test:production-env

      - name: Build production APK
        working-directory: ${{ steps.source.outputs.project_root }}
        env:
          API_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          BUILD_PROFILE: production
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$API_BASE_URL"
          test -n "$ANDROID_RELEASE_KEYSTORE_B64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"

          bash tools/build_apk_release.sh

      - name: Verify production APK
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "PRODUCTION_FAIL: production APK not found."
            exit 60
          fi

          test "$(stat -c '%s' "$APK")" -gt 1048576

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          sha256sum "$APK" | tee artifacts/APK-SHA256.txt

      - name: Docker build verification
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE="hope-backend:${GITHUB_SHA}"

          docker build \
            --pull \
            -t "$IMAGE" \
            .

          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"

          test -n "$IMAGE_ID"

          mkdir -p ../artifacts

          echo "$IMAGE_ID" | tee ../artifacts/backend-image-id.txt

      - name: Release manifest
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          STAGING_CERTIFICATION_STATUS: PASS
          STAGING_CERTIFICATION_RUN_ID: ${{ needs.staging.outputs.certification_run_id }}
          STAGING_CERTIFICATION_SHA: ${{ needs.staging.outputs.certification_sha }}
          STAGING_CERTIFICATION_ATTEMPT: ${{ needs.staging.outputs.certification_attempt }}
          BACKEND_IMAGE_ID: ${{ needs.staging.outputs.certification_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run release:manifest

          test -s artifacts/release-manifest.json

      - name: Verify release manifest identity
        working-directory: ${{ steps.source.outputs.project_root }}/backend
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_STAGING_SHA: ${{ needs.staging.outputs.certification_sha }}
          EXPECTED_STAGING_RUN_ID: ${{ needs.staging.outputs.certification_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$EXPECTED_SHA" "$EXPECTED_STAGING_SHA" "$EXPECTED_STAGING_RUN_ID" <<'PY'
          import json
          import pathlib
          import sys

          expected_sha = sys.argv[1]
          expected_staging_sha = sys.argv[2]
          expected_staging_run_id = sys.argv[3]

          path = pathlib.Path("artifacts/release-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          def require(name, value):
              if value in (None, "", False):
                  raise SystemExit(
                      f"RELEASE_MANIFEST_FAIL: missing {name}"
                  )

          require(
              "certification_status",
              data.get("staging_certification_status"),
          )

          require(
              "staging_certification_run_id",
              data.get("staging_certification_run_id"),
          )

          require(
              "staging_certification_sha",
              data.get("staging_certification_sha"),
          )

          if str(data["staging_certification_status"]).upper() != "PASS":
              raise SystemExit(
                  "RELEASE_MANIFEST_FAIL: staging certification is not PASS"
              )

          if data["staging_certification_sha"] != expected_sha:
              raise SystemExit(
                  "RELEASE_MANIFEST_FAIL: staging certification SHA "
                  "does not equal release SHA"
              )

          if data["staging_certification_sha"] != expected_staging_sha:
              raise SystemExit(
                  "RELEASE_MANIFEST_FAIL: manifest staging SHA "
                  "differs from staging job output"
              )

          if str(data["staging_certification_run_id"]) != str(
              expected_staging_run_id
          ):
              raise SystemExit(
                  "RELEASE_MANIFEST_FAIL: manifest staging run ID "
                  "differs from staging job output"
              )

          print("RELEASE_MANIFEST_IDENTITY_PASS")
          PY

      - name: Upload production evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hope-v8-production-evidence-${{ github.sha }}
          path: |
            ${{ steps.source.outputs.project_root }}/artifacts/**
            ${{ steps.source.outputs.project_root }}/backend/artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Attest production build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.source.outputs.project_root }}/artifacts/*.apk

      - name: Production release gate
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "HOPE-V8 PRODUCTION VERIFICATION PASS"
          echo "=========================================="
          echo "Release SHA:       $GITHUB_SHA"
          echo "Staging SHA:       ${{ needs.staging.outputs.certification_sha }}"
          echo "Staging Run ID:    ${{ needs.staging.outputs.certification_run_id }}"
          echo "Staging Attempt:   ${{ needs.staging.outputs.certification_attempt }}"
          echo "=========================================="
