#!/usr/bin/env bash
set -Eeuo pipefail

###############################################################################
# HOPE V8 BOOTSTRAP
# Version: 8.0.0
#
# Responsibilities:
#   1. Detect GitHub repository root
#   2. Discover uploaded HOPE ZIP automatically
#   3. Validate ZIP safety
#   4. Extract ZIP into isolated temporary directory
#   5. Find the real project root inside the extracted archive
#   6. Backup the current project
#   7. Synchronize the uploaded project into repository root
#   8. Restore executable permissions
#   9. Validate project structure
#  10. Validate toolchain
#  11. Install backend dependencies
#  12. Run backend syntax checks
#  13. Run persistence-boundary checks
#  14. Run backend fast tests
#  15. Run backend contract tests
#  16. Run architecture tests when available
#  17. Run npm security audit
#  18. Run Flutter dependency installation
#  19. Run Flutter analyze
#  20. Run Flutter tests
#  21. Optionally run Flutter Android build
#  22. Audit GitHub Actions
#  23. Audit repository hygiene
#  24. Produce TXT + JSON reports
#
# Important:
#   - Production persistence must remain PostgreSQL.
#   - Legacy persistence is allowed only inside explicit legacy/test adapters.
#   - Routes must not directly access db.collection/db.insert/db.update/etc.
###############################################################################

SCRIPT_NAME="HOPE V8 Bootstrap"
VERSION="8.0.0"

ROOT_DIR="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
ROOT_DIR="$(cd "$ROOT_DIR" && pwd)"

WORK_BASE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
WORK_DIR="$WORK_BASE/hope-v8-bootstrap"
EXTRACT_DIR="$WORK_DIR/extracted"
BACKUP_DIR="$WORK_DIR/backup"

REPORT_DIR="$ROOT_DIR/.hope-bootstrap"
REPORT_TXT="$REPORT_DIR/bootstrap-report.txt"
REPORT_JSON="$REPORT_DIR/bootstrap-report.json"

mkdir -p \
    "$WORK_DIR" \
    "$EXTRACT_DIR" \
    "$BACKUP_DIR" \
    "$REPORT_DIR"

START_TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

PASS_COUNT=0
FAIL_COUNT=0
WARN_COUNT=0

declare -a REPORT_LINES=()
declare -a ZIP_CANDIDATES=()

###############################################################################
# LOGGING
###############################################################################

section() {
    printf '\n'
    printf '=====================================================================\n'
    printf ' %s\n' "$*"
    printf '=====================================================================\n'
}

log() {
    printf '\n[%s] %s\n' "$(date '+%H:%M:%S')" "$*"
}

info() {
    printf '  INFO: %s\n' "$*"
}

pass() {
    PASS_COUNT=$((PASS_COUNT + 1))
    printf '  PASS: %s\n' "$*"
    REPORT_LINES+=("PASS|$*")
}

warn() {
    WARN_COUNT=$((WARN_COUNT + 1))
    printf '  WARN: %s\n' "$*" >&2
    REPORT_LINES+=("WARN|$*")
}

fail() {
    FAIL_COUNT=$((FAIL_COUNT + 1))
    printf '  FAIL: %s\n' "$*" >&2
    REPORT_LINES+=("FAIL|$*")
}

die() {
    fail "$*"
    write_reports || true
    exit 1
}

have() {
    command -v "$1" >/dev/null 2>&1
}

###############################################################################
# CLEANUP
###############################################################################

cleanup() {
    if [[ "${KEEP_BOOTSTRAP_TEMP:-0}" != "1" ]]; then
        rm -rf "$WORK_DIR" || true
    fi
}

trap cleanup EXIT

###############################################################################
# ZIP DISCOVERY
###############################################################################

find_zip_candidates() {

    ZIP_CANDIDATES=()

    # Explicit override.
    if [[ -n "${HOPE_ZIP:-}" ]]; then

        if [[ -f "$HOPE_ZIP" ]]; then
            ZIP_CANDIDATES+=("$(realpath "$HOPE_ZIP")")
        else
            die "HOPE_ZIP was specified but does not exist: $HOPE_ZIP"
        fi

    fi

    # Search repository.
    while IFS= read -r candidate; do

        [[ -z "$candidate" ]] && continue

        ZIP_CANDIDATES+=("$candidate")

    done < <(
        find "$ROOT_DIR" \
            -maxdepth 5 \
            -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -not -path "*/.git/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/.hope-bootstrap/*" \
            -print 2>/dev/null |
        sort
    )

    # Remove duplicates.
    if [[ "${#ZIP_CANDIDATES[@]}" -gt 1 ]]; then

        mapfile -t ZIP_CANDIDATES < <(
            printf '%s\n' "${ZIP_CANDIDATES[@]}" |
            awk '!seen[$0]++'
        )

    fi
}

choose_zip() {

    find_zip_candidates

    if [[ "${#ZIP_CANDIDATES[@]}" -eq 0 ]]; then
        return 1
    fi

    local selected=""

    # Prefer HOPE-looking release archives.
    selected="$(
        printf '%s\n' "${ZIP_CANDIDATES[@]}" |
        grep -Ei \
            'hope|v[0-9]+|release|final|source|build|session' |
        head -n 1 || true
    )"

    # Otherwise newest ZIP.
    if [[ -z "$selected" ]]; then

        selected="$(
            ls -1t "${ZIP_CANDIDATES[@]}" 2>/dev/null |
            head -n 1
        )"

    fi

    [[ -z "$selected" ]] && return 1

    printf '%s\n' "$selected"
}

###############################################################################
# ZIP SAFETY
###############################################################################

validate_zip_paths() {

    local zip_file="$1"

    have unzip || die "unzip is required."

    log "Validating ZIP safety"

    local unsafe=0
    local entry
    local normalized

    while IFS= read -r entry; do

        [[ -z "$entry" ]] && continue

        # Absolute UNIX path.
        if [[ "$entry" == /* ]]; then

            fail "Unsafe absolute path in ZIP: $entry"
            unsafe=1
            continue

        fi

        # Normalize Windows separators.
        normalized="${entry//\\//}"

        # Path traversal.
        if [[ "$normalized" == ../* ||
              "$normalized" == */../* ||
              "$normalized" == */.. ]]; then

            fail "Unsafe traversal path in ZIP: $entry"
            unsafe=1
            continue

        fi

        # Never extract Git metadata.
        if [[ "$normalized" == .git/* ||
              "$normalized" == */.git/* ]]; then

            fail "ZIP contains .git content: $entry"
            unsafe=1
            continue

        fi

    done < <(
        unzip -Z1 "$zip_file"
    )

    if [[ "$unsafe" -ne 0 ]]; then
        return 1
    fi

    pass "ZIP path safety validation"
}

###############################################################################
# PROJECT ROOT DETECTION
###############################################################################

is_project_root() {

    local dir="$1"

    [[ -f "$dir/pubspec.yaml" ]] &&
    [[ -f "$dir/backend/package.json" ]] &&
    [[ -d "$dir/backend/src" ]] &&
    [[ -d "$dir/lib" ]]
}

find_project_root_inside() {

    local base="$1"

    if is_project_root "$base"; then
        printf '%s\n' "$base"
        return 0
    fi

    local candidate

    while IFS= read -r pubspec; do

        candidate="$(dirname "$pubspec")"

        if is_project_root "$candidate"; then
            printf '%s\n' "$candidate"
            return 0
        fi

    done < <(
        find "$base" \
            -maxdepth 6 \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -print 2>/dev/null
    )

    return 1
}

###############################################################################
# BACKUP
###############################################################################

backup_current_project() {

    section "BACKUP CURRENT PROJECT"

    local backup="$BACKUP_DIR/current-project"

    rm -rf "$backup"
    mkdir -p "$backup"

    local item

    for item in \
        backend \
        lib \
        android \
        ios \
        web \
        assets \
        test \
        integration_test \
        tools \
        docs \
        .github \
        pubspec.yaml \
        pubspec.lock \
        analysis_options.yaml \
        README.md
    do

        if [[ -e "$ROOT_DIR/$item" ]]; then

            mkdir -p "$backup/$(dirname "$item")"

            if have rsync; then

                rsync -a \
                    --exclude='.git' \
                    --exclude='node_modules' \
                    --exclude='build' \
                    --exclude='.dart_tool' \
                    "$ROOT_DIR/$item" \
                    "$backup/$(dirname "$item")/" \
                    >/dev/null

            else

                cp -a \
                    "$ROOT_DIR/$item" \
                    "$backup/$(dirname "$item")/"

            fi

        fi

    done

    pass "Current project backup created"
}

###############################################################################
# PROJECT SYNCHRONIZATION
###############################################################################

sync_project() {

    local source_root="$1"

    section "SYNC PROJECT"

    backup_current_project

    if have rsync; then

        rsync -a \
            --delete-delay \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='build/' \
            --exclude='.dart_tool/' \
            --exclude='.idea/' \
            --exclude='.hope-bootstrap/' \
            "$source_root/" \
            "$ROOT_DIR/"

    else

        local item

        for item in \
            backend \
            lib \
            android \
            ios \
            web \
            assets \
            test \
            integration_test \
            tools \
            docs \
            .github
        do
            rm -rf "$ROOT_DIR/$item"
        done

        find "$source_root" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            -exec cp -a {} "$ROOT_DIR/" \;

    fi

    pass "Project synchronized into repository root"

    # Normalize executable permissions.
    if [[ -d "$ROOT_DIR/tools" ]]; then

        find "$ROOT_DIR/tools" \
            -type f \
            \( -name "*.sh" -o -name "*.bash" \) \
            -exec chmod +x {} \; \
            2>/dev/null || true

    fi

    if [[ -f "$ROOT_DIR/backend/entrypoint.sh" ]]; then
        chmod +x "$ROOT_DIR/backend/entrypoint.sh"
    fi

    if [[ -f "$ROOT_DIR/android/gradlew" ]]; then
        chmod +x "$ROOT_DIR/android/gradlew"
    fi

    pass "Executable permissions normalized"
}

###############################################################################
# STRUCTURE
###############################################################################

inspect_structure() {

    section "PROJECT STRUCTURE"

    local required=(
        "pubspec.yaml"
        "lib"
        "backend"
        "backend/package.json"
        "backend/src"
    )

    local item

    for item in "${required[@]}"; do

        if [[ -e "$ROOT_DIR/$item" ]]; then
            pass "Required: $item"
        else
            fail "Missing required item: $item"
        fi

    done

    if [[ -f "$ROOT_DIR/backend/package-lock.json" ]]; then
        pass "Backend lockfile present"
    else
        warn "backend/package-lock.json missing"
    fi

    if [[ -f "$ROOT_DIR/pubspec.lock" ]]; then
        pass "Flutter lockfile present"
    else
        warn "pubspec.lock missing"
    fi

    if [[ -d "$ROOT_DIR/.github/workflows" ]]; then
        pass "GitHub Actions directory present"
    else
        warn ".github/workflows missing"
    fi
}

###############################################################################
# TOOLCHAIN
###############################################################################

inspect_toolchain() {

    section "TOOLCHAIN"

    local commands=(
        git
        unzip
        python3
        node
        npm
    )

    local cmd

    for cmd in "${commands[@]}"; do

        if have "$cmd"; then
            pass "$cmd available: $("$cmd" --version 2>&1 | head -n 1)"
        else
            fail "$cmd is missing"
        fi

    done

    if have flutter; then
        pass "flutter available: $(flutter --version 2>/dev/null | head -n 1)"
    else
        warn "Flutter unavailable; Flutter gates will be skipped"
    fi

    if have dart; then
        pass "dart available"
    else
        warn "Dart executable not separately available"
    fi
}

###############################################################################
# NPM SCRIPT DISCOVERY
###############################################################################

get_npm_script() {

    local package_json="$1"
    local script_name="$2"

    node - "$package_json" "$script_name" <<'NODE'
const fs = require("fs");

const file = process.argv[2];
const name = process.argv[3];

try {
  const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
  const value = pkg?.scripts?.[name];

  if (typeof value === "string") {
    process.stdout.write(value);
  }

} catch (_) {}
NODE
}

###############################################################################
# BACKEND
###############################################################################

backend_validation() {

    section "BACKEND VALIDATION"

    if [[ ! -d "$ROOT_DIR/backend" ]]; then
        warn "Backend directory missing"
        return 0
    fi

    cd "$ROOT_DIR/backend"

    # Install dependencies.
    if [[ -f package-lock.json ]]; then

        if npm ci; then
            pass "npm ci"
        else
            fail "npm ci"
            return 1
        fi

    else

        if npm install; then
            pass "npm install"
        else
            fail "npm install"
            return 1
        fi

    fi

    # Syntax check all backend JavaScript.
    local syntax_failed=0
    local file

    while IFS= read -r file; do

        if ! node --check "$file" >/dev/null 2>&1; then

            fail "Node syntax: $file"
            syntax_failed=1

        fi

    done < <(
        find "$ROOT_DIR/backend/src" \
            -type f \
            -name "*.js" \
            -not -path "*/node_modules/*" \
            -print 2>/dev/null
    )

    if [[ "$syntax_failed" -eq 0 ]]; then
        pass "Backend syntax validation"
    fi

    ###########################################################################
    # Preferred tests.
    ###########################################################################

    local ran_fast=0
    local script

    if [[ -n "$(get_npm_script "$ROOT_DIR/backend/package.json" "test:fast")" ]]; then

        ran_fast=1

        if npm run test:fast; then
            pass "npm run test:fast"
        else
            fail "npm run test:fast"
            return 1
        fi

    fi

    if [[ -n "$(get_npm_script "$ROOT_DIR/backend/package.json" "test:contract")" ]]; then

        if npm run test:contract; then
            pass "npm run test:contract"
        else
            fail "npm run test:contract"
            return 1
        fi

    fi

    if [[ -n "$(get_npm_script "$ROOT_DIR/backend/package.json" "test:architecture-layers")" ]]; then

        if npm run test:architecture-layers; then
            pass "npm run test:architecture-layers"
        else
            fail "npm run test:architecture-layers"
            return 1
        fi

    elif [[ -n "$(get_npm_script "$ROOT_DIR/backend/package.json" "test:architecture")" ]]; then

        if npm run test:architecture; then
            pass "npm run test:architecture"
        else
            fail "npm run test:architecture"
            return 1
        fi

    fi

    ###########################################################################
    # Optional complete test suite.
    ###########################################################################

    if [[ "${RUN_FULL_TEST:-0}" == "1" ]]; then

        if [[ -n "$(get_npm_script "$ROOT_DIR/backend/package.json" "test")" ]]; then

            if npm test; then
                pass "npm test"
            else
                fail "npm test"
                return 1
            fi

        else
            warn "npm test script unavailable"
        fi

    else

        warn "Full npm test skipped; set RUN_FULL_TEST=1 to enable"

    fi

    ###########################################################################
    # Security audit.
    ###########################################################################

    if npm audit --audit-level=high; then
        pass "npm audit --audit-level=high"
    else
        fail "npm audit detected high/critical vulnerabilities"
        return 1
    fi

    cd "$ROOT_DIR"
}

###############################################################################
# PERSISTENCE BOUNDARY
###############################################################################

persistence_boundary_audit() {

    section "PERSISTENCE BOUNDARY"

    local routes_count
    local upper_count
    local total_count
    local legacy_count

    routes_count="$(
        grep -RInE \
            --include='*.js' \
            --exclude-dir=node_modules \
            --exclude-dir=legacy \
            'db\.(collection|insert|update|touch|reset|save)' \
            "$ROOT_DIR/backend/src/routes" 2>/dev/null |
        wc -l |
        tr -d ' '
    )"

    total_count="$(
        grep -RInE \
            --include='*.js' \
            --exclude-dir=node_modules \
            'db\.(collection|insert|update|touch|reset|save)' \
            "$ROOT_DIR/backend/src" 2>/dev/null |
        wc -l |
        tr -d ' '
    )"

    legacy_count="$(
        grep -RInE \
            --include='*.js' \
            'db\.(collection|insert|update|touch|reset|save)' \
            "$ROOT_DIR/backend/src/legacy" 2>/dev/null |
        wc -l |
        tr -d ' '
    )"

    info "Route direct db references: $routes_count"
    info "Total backend direct db references: $total_count"
    info "Legacy adapter references: $legacy_count"

    if [[ "$routes_count" -eq 0 ]]; then
        pass "Route persistence boundary: ZERO direct db.* references"
    else
        fail "Route persistence boundary violated: $routes_count references remain"
    fi

    ###########################################################################
    # Upper application/service layers.
    ###########################################################################

    upper_count="$(
        grep -RInE \
            --include='*.js' \
            --exclude-dir=node_modules \
            --exclude-dir=legacy \
            'db\.(collection|insert|update|touch|reset|save)' \
            "$ROOT_DIR/backend/src/application" \
            "$ROOT_DIR/backend/src/services" 2>/dev/null |
        wc -l |
        tr -d ' '
    )"

    info "Application/service direct db references: $upper_count"

    if [[ "$upper_count" -eq 0 ]]; then
        pass "Application/service persistence boundary"
    else
        fail "Application/service persistence boundary violated: $upper_count references"
    fi
}

###############################################################################
# PRODUCTION DATABASE GUARD
###############################################################################

production_guard_audit() {

    section "PRODUCTION DATABASE GUARD"

    local db_file="$ROOT_DIR/backend/src/db.js"

    if [[ ! -f "$db_file" ]]; then
        fail "backend/src/db.js missing"
        return 1
    fi

    if grep -q \
        "PostgreSQL is required outside the explicit NODE_ENV=test runtime" \
        "$db_file"; then

        pass "Production requires PostgreSQL"

    else

        warn "PostgreSQL production guard text not detected"

    fi

    if grep -q \
        "db.collection is unavailable in production" \
        "$db_file"; then

        pass "Production db.collection guard present"

    else

        warn "Production db.collection guard not detected"

    fi
}

###############################################################################
# FLUTTER
###############################################################################

flutter_validation() {

    section "FLUTTER VALIDATION"

    if ! have flutter; then
        warn "Flutter unavailable; skipping Flutter validation"
        return 0
    fi

    if [[ ! -f "$ROOT_DIR/pubspec.yaml" ]]; then
        warn "pubspec.yaml missing"
        return 0
    fi

    cd "$ROOT_DIR"

    if flutter pub get; then
        pass "flutter pub get"
    else
        fail "flutter pub get"
        return 1
    fi

    if [[ -f "$ROOT_DIR/tools/verify-pubspec-lock-fresh.sh" ]]; then

        chmod +x "$ROOT_DIR/tools/verify-pubspec-lock-fresh.sh"

        if "$ROOT_DIR/tools/verify-pubspec-lock-fresh.sh"; then
            pass "pubspec.lock freshness"
        else
            fail "pubspec.lock freshness"
            return 1
        fi

    fi

    if flutter analyze; then
        pass "flutter analyze"
    else
        fail "flutter analyze"
        return 1
    fi

    if flutter test --no-pub; then
        pass "flutter test --no-pub"
    else
        fail "flutter test --no-pub"
        return 1
    fi

    if [[ "${RUN_FLUTTER_BUILD:-0}" == "1" ]]; then

        if flutter build apk --debug; then
            pass "Flutter Android debug build"
        else
            fail "Flutter Android debug build"
            return 1
        fi

    else

        warn "Flutter Android build skipped; set RUN_FLUTTER_BUILD=1"

    fi

    cd "$ROOT_DIR"
}

###############################################################################
# GITHUB ACTIONS
###############################################################################

github_actions_audit() {

    section "GITHUB ACTIONS"

    local workflows="$ROOT_DIR/.github/workflows"

    if [[ ! -d "$workflows" ]]; then
        warn ".github/workflows missing"
        return 0
    fi

    local count

    count="$(
        find "$workflows" \
            -maxdepth 1 \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) |
        wc -l |
        tr -d ' '
    )"

    info "Workflow count: $count"

    if [[ "$count" -gt 0 ]]; then
        pass "GitHub Actions workflows detected"
    else
        warn "No GitHub Actions workflows detected"
    fi

    # Ensure our V8 bootstrap exists.
    if [[ -f "$ROOT_DIR/tools/bootstrap-v8.sh" ]]; then
        pass "HOPE V8 bootstrap present"
    else
        warn "tools/bootstrap-v8.sh not found"
    fi
}

###############################################################################
# HYGIENE
###############################################################################

hygiene_audit() {

    section "REPOSITORY HYGIENE"

    local forbidden=(
        node_modules
        .dart_tool
        build
        .idea
    )

    local item

    for item in "${forbidden[@]}"; do

        if [[ -d "$ROOT_DIR/$item" ]]; then
            warn "Generated/local directory at root: $item"
        fi

    done

    ###########################################################################
    # Obvious credential patterns.
    ###########################################################################

    local secret_hits=0

    if grep -RInE \
        --exclude-dir=.git \
        --exclude-dir=node_modules \
        --exclude-dir=.dart_tool \
        --exclude-dir=build \
        --exclude='*.lock' \
        '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN PRIVATE KEY)' \
        "$ROOT_DIR" 2>/dev/null |
        head -n 20 |
        grep -q .; then

        secret_hits=1

    fi

    if [[ "$secret_hits" -eq 0 ]]; then
        pass "No obvious hard-coded credential pattern detected"
    else
        fail "Possible hard-coded credential detected"
    fi
}

###############################################################################
# REPORT
###############################################################################

write_reports() {

    mkdir -p "$REPORT_DIR"

    local end_ts
    end_ts="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

    {
        echo "HOPE V8 BOOTSTRAP REPORT"
        echo "========================"
        echo "version=$VERSION"
        echo "started=$START_TS"
        echo "finished=$end_ts"
        echo "root=$ROOT_DIR"
        echo "pass=$PASS_COUNT"
        echo "warn=$WARN_COUNT"
        echo "fail=$FAIL_COUNT"
        echo
        printf '%s\n' "${REPORT_LINES[@]}"
    } > "$REPORT_TXT"

    python3 \
        - "$REPORT_JSON" \
        "$VERSION" \
        "$START_TS" \
        "$end_ts" \
        "$ROOT_DIR" \
        "$PASS_COUNT" \
        "$WARN_COUNT" \
        "$FAIL_COUNT" \
        "${REPORT_LINES[@]}" <<'PY'

import json
import sys

output = sys.argv[1]

payload = {
    "bootstrap": "HOPE V8",
    "version": sys.argv[2],
    "started": sys.argv[3],
    "finished": sys.argv[4],
    "root": sys.argv[5],
    "pass": int(sys.argv[6]),
    "warn": int(sys.argv[7]),
    "fail": int(sys.argv[8]),
    "events": []
}

for raw in sys.argv[9:]:

    if "|" in raw:
        status, message = raw.split("|", 1)
    else:
        status = "INFO"
        message = raw

    payload["events"].append({
        "status": status,
        "message": message
    })

with open(output, "w", encoding="utf-8") as f:

    json.dump(
        payload,
        f,
        indent=2,
        ensure_ascii=False
    )

    f.write("\n")

PY

    info "TXT report:  $REPORT_TXT"
    info "JSON report: $REPORT_JSON"
}

###############################################################################
# MAIN
###############################################################################

main() {

    section "$SCRIPT_NAME v$VERSION"

    info "Repository root:"
    info "$ROOT_DIR"

    ###########################################################################
    # Git repository.
    ###########################################################################

    section "GIT REPOSITORY"

    if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        pass "Git repository detected"
    else
        warn "Current directory is not a Git repository"
    fi

    ###########################################################################
    # Toolchain.
    ###########################################################################

    inspect_toolchain

    ###########################################################################
    # ZIP.
    ###########################################################################

    section "ZIP DISCOVERY"

    local zip_file=""

    zip_file="$(choose_zip || true)"

    if [[ -z "$zip_file" ]]; then

        warn "No ZIP detected; using current repository contents"

    else

        pass "ZIP detected: $(basename "$zip_file")"

        if [[ ! -s "$zip_file" ]]; then
            die "ZIP is empty"
        fi

        if ! validate_zip_paths "$zip_file"; then
            die "ZIP safety validation failed"
        fi

        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"

        if unzip -q "$zip_file" -d "$EXTRACT_DIR"; then
            pass "ZIP extracted successfully"
        else
            die "ZIP extraction failed"
        fi

        local uploaded_root=""

        uploaded_root="$(
            find_project_root_inside "$EXTRACT_DIR" || true
        )"

        if [[ -z "$uploaded_root" ]]; then
            die "Could not detect project root inside uploaded ZIP"
        fi

        pass "Project root detected"

        info "$uploaded_root"

        sync_project "$uploaded_root"

    fi

    ###########################################################################
    # Structure.
    ###########################################################################

    inspect_structure

    if [[ "$FAIL_COUNT" -gt 0 ]]; then
        write_reports
        die "Structural validation failed"
    fi

    ###########################################################################
    # Persistence.
    ###########################################################################

    production_guard_audit
    persistence_boundary_audit

    ###########################################################################
    # Backend.
    ###########################################################################

    if ! backend_validation; then
        write_reports
        die "Backend validation failed"
    fi

    ###########################################################################
    # Flutter.
    ###########################################################################

    if ! flutter_validation; then
        write_reports
        die "Flutter validation failed"
    fi

    ###########################################################################
    # GitHub Actions.
    ###########################################################################

    github_actions_audit

    ###########################################################################
    # Hygiene.
    ###########################################################################

    hygiene_audit

    ###########################################################################
    # Reports.
    ###########################################################################

    write_reports

    ###########################################################################
    # Final result.
    ###########################################################################

    section "FINAL RESULT"

    printf 'PASS: %s\n' "$PASS_COUNT"
    printf 'WARN: %s\n' "$WARN_COUNT"
    printf 'FAIL: %s\n' "$FAIL_COUNT"

    if [[ "$FAIL_COUNT" -gt 0 ]]; then

        echo
        echo "HOPE V8 BOOTSTRAP FAILED"
        echo
        echo "Review:"
        echo "  $REPORT_TXT"
        echo "  $REPORT_JSON"

        exit 1

    fi

    echo
    echo "==============================================================="
    echo " HOPE V8 BOOTSTRAP COMPLETE"
    echo "==============================================================="
    echo
    echo "Project imported."
    echo "Project structure validated."
    echo "Persistence boundaries validated."
    echo "Backend validated."
    echo "Flutter validated."
    echo "Security audit completed."
    echo
    echo "Reports:"
    echo "  $REPORT_TXT"
    echo "  $REPORT_JSON"
    echo

}

main "$@"
