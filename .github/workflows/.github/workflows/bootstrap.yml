name: HOPE-V7 Bootstrap

on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        description: "Expected SHA-256 of the session archive"
        required: true
        default: "a627e5de48621e2f2f1f797be7bb29804b445a55d1201305d2da7cf4b4bb7407"
      run_checks:
        description: "Run bootstrap verification checks"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap HOPE-V7 from uploaded session archive
        env:
          EXPECTED_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail

          ROOT="$(git rev-parse --show-toplevel)"
          cd "$ROOT"

          ARCHIVE="HOPE-V7-4.0.20-SESSION-20260913T141130Z-final.zip"
          URL="https://raw.githubusercontent.com/amirdavodpour-stack/V2hope/main/${ARCHIVE}"
          TMP="/tmp/hope-v7-session.zip"

          echo "============================================"
          echo "HOPE-V7 BOOTSTRAP"
          echo "============================================"
          echo "Repository: amirdavodpour-stack/V2hope"
          echo "Archive:    $ARCHIVE"
          echo

          echo "[1/6] Downloading source archive..."
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$TMP"

          echo "[2/6] Verifying SHA-256..."
          ACTUAL_SHA256="$(sha256sum "$TMP" | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo
            echo "FATAL: SHA-256 mismatch."
            echo "Bootstrap stopped. No extraction or commit performed."
            exit 1
          fi

          echo "SHA-256 verification PASSED."

          echo "[3/6] Extracting archive..."
          EXTRACT_DIR="/tmp/hope-v7-extract"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$TMP" -d "$EXTRACT_DIR"

          echo "[4/6] Copying project into repository root..."

          rsync -a \
            --exclude ".git/" \
            --exclude ".github/workflows/bootstrap.yml" \
            "$EXTRACT_DIR/" "$ROOT/"

          echo "[5/6] Writing provenance record..."

          cat > "$ROOT/BOOTSTRAP-PROVENANCE.md" <<EOF
          # HOPE-V7 GitHub Bootstrap Provenance

          Source repository:
          https://github.com/amirdavodpour-stack/V2hope

          Source archive:
          \`$ARCHIVE\`

          Source archive URL:
          \`$URL\`

          Expected SHA-256:
          \`$EXPECTED_SHA256\`

          Actual SHA-256:
          \`$ACTUAL_SHA256\`

          Bootstrap date:
          $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          This bootstrap verifies the source archive before extraction.

          It does not:
          - weaken tests
          - delete tests
          - reduce thresholds
          - suppress errors
          - replace real integrations with mocks
          - fabricate certification evidence
          - bypass security or financial invariants
          EOF

          echo "[6/6] Bootstrap extraction completed."
          echo
          echo "HOPE-V7 source is now present in the repository root."
